title: Setting
tabs:
  main:
    display: Main
    sections:
      -
        fields:
          -
            handle: site_name
            field: { type: text, display: 'Site name' }
          -
            handle: logo
            field: { type: assets, container: assets, max_files: 1, display: Logo }
          -
            handle: logo_white
            field: { type: assets, container: assets, max_files: 1, display: 'Logo (light / white)' }
          -
            handle: footer_logo
            field: { type: assets, container: assets, max_files: 1, display: 'Footer logo' }
          -
            handle: favicon
            field: { type: assets, container: assets, max_files: 1, display: Favicon }
          -
            handle: phone
            field: { type: text, display: Phone }
          -
            handle: email
            field: { type: text, display: Email }
          -
            handle: address
            field: { type: textarea, display: Address }
          -
            handle: map_url
            field: { type: text, display: 'Map URL' }
          -
            handle: copyright
            field: { type: text, display: Copyright }
          -
            handle: seo_description
            field: { type: textarea, display: 'Default SEO description' }
          -
            handle: facebook_url
            field: { type: text, display: 'Facebook URL' }
          -
            handle: instagram_url
            field: { type: text, display: 'Instagram URL' }
          -
            handle: inquiry_button
            field: { type: text, display: 'Inquiry button' }
          -
            handle: inquiry_success
            field: { type: text, display: 'Inquiry success' }
          -
            handle: comment_button
            field: { type: text, display: 'Comment button' }
          -
            handle: comment_success
            field: { type: text, display: 'Comment success' }
          -
            handle: x_url
            field: { type: text, display: 'X URL' }
          -
            handle: youtube_url
            field: { type: text, display: 'YouTube URL' }
          -
            handle: pinterest_url
            field: { type: text, display: 'Pinterest URL' }
          -
            handle: linkedin_url
            field: { type: text, display: 'LinkedIn URL' }
          -
            handle: whatsapp_url
            field: { type: text, display: 'WhatsApp URL' }
      -
        display: Instagram
        fields:
          -
            handle: instagram_token
            field:
              type: text
              display: 'Access token'
              instructions: 'Professional account token. Home, Home three, and Home six then play that account reels. Leave blank to keep the section photos.'
          -
            handle: instagram_user_id
            field:
              type: text
              display: 'User id'
              instructions: 'Only when the account is connected through a Facebook Page. Leave blank for an Instagram login token.'
      -
        display: Chrome
        fields:
          -
            handle: newsletter_heading
            field: { type: text, display: 'Newsletter heading' }
          -
            handle: newsletter_text
            field: { type: textarea, display: 'Newsletter text' }
          -
            handle: footer_intro
            field: { type: textarea, display: 'Footer introduction' }
          -
            handle: contact_heading
            field: { type: text, display: 'Contact heading' }
          -
            handle: contact_text
            field: { type: textarea, display: 'Contact text' }
          -
            handle: news_heading
            field: { type: text, display: 'Journal heading' }
          -
            handle: instagram_heading
            field: { type: text, display: 'Instagram heading' }
          -
            handle: footer_photos
            field: { type: assets, container: assets, display: 'Footer photos' }
          -
            handle: company_heading
            field: { type: text, display: 'Company menu heading' }
          -
            handle: services_heading
            field: { type: text, display: 'Services menu heading' }
          -
            handle: provided_heading
            field: { type: text, display: 'Provided menu heading' }
          -
            handle: resources_heading
            field: { type: text, display: 'Resources menu heading' }
          -
            handle: support_heading
            field: { type: text, display: 'Support menu heading' }
          -
            handle: general_heading
            field: { type: text, display: 'General menu heading' }
          -
            handle: helpful_heading
            field: { type: text, display: 'Helpful menu heading' }
          -
            handle: following_heading
            field: { type: text, display: 'Following / social heading' }
          -
            handle: about_heading
            field: { type: text, display: 'About column heading' }
          -
            handle: header_promo_text
            field: { type: text, display: 'Header promo text' }
          -
            handle: header_promo_button
            field: { type: text, display: 'Header promo link text' }
          -
            handle: pages_menu_label
            field: { type: text, display: 'Pages mega-menu label' }
          -
            handle: popup_heading
            field: { type: text, display: 'Popup heading' }
          -
            handle: popup_text
            field: { type: textarea, display: 'Popup text' }
          -
            handle: popup_button
            field: { type: text, display: 'Popup button' }
          -
            handle: cookie_heading
            field: { type: text, display: 'Cookie heading' }
          -
            handle: cookie_text
            field: { type: textarea, display: 'Cookie text' }
          -
            handle: cookie_accept
            field: { type: text, display: 'Cookie accept' }
          -
            handle: cookie_manage
            field: { type: text, display: 'Cookie manage' }
          -
            handle: invoice_color
            field:
              type: text
              display: 'Invoice PDF color'
              instructions: 'Hex color for the inquiry invoice PDF header and accents. Default is theme green #247A4D.'
          -
            handle: coupons
            field:
              type: replicator
              display: Coupons
              instructions: 'Demo cart coupons. They only change the on-screen total. Nothing is charged.'
              sets:
                coupon:
                  display: Coupon
                  fields:
                    -
                      handle: code
                      field: { type: text, display: Code, required: true, instructions: 'Case-insensitive code shoppers type (example SAVE10).' }
                    -
                      handle: discount_type
                      field:
                        type: select
                        display: 'Discount type'
                        options:
                          percent: Percent off
                          fixed: Fixed amount off
                        default: percent
                        required: true
                    -
                      handle: amount
                      field: { type: float, display: Amount, required: true, instructions: 'Percent (10 = 10%) or fixed dollars.' }
                    -
                      handle: label
                      field: { type: text, display: Label, instructions: 'Shown next to the discount on the cart.' }
          -
            handle: shipping_options
            field:
              type: replicator
              display: 'Shipping options'
              instructions: 'Cart shipping choices. The selected price is added to the displayed total. Nothing is charged.'
              sets:
                option:
                  display: Option
                  fields:
                    -
                      handle: label
                      field: { type: text, display: Label, required: true }
                    -
                      handle: price
                      field: { type: float, display: Price }
