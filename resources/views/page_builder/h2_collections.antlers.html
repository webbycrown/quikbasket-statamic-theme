<section class="relative 2xl:py-[50px] 1xl:py-[45px] xl:py-[40px] lg:py-[35px] md:py-[30px] sm:py-[25px] py-[20px]">
    <div class="shop-collection relative bg-violet-400 2xl:py-[90px] xl:py-[70px] lg:py-16 py-10">
        <div class="container">
            <div class="flex relative md:justify-between justify-center 1xl:mb-[40px] lg:mb-[35px] mb-[30px] items-center">
                <h3 class="leading-8 text-[#1F2937] z-10 md:text-start text-center">{{ heading }}</h3>
                <div class="relative arrow md:block hidden">
                    <div class="swiper-button-next"></div>
                    <div class="swiper-button-prev pr-[10px]"></div>
                </div>
            </div>
            <div class="swiper collection">
                <div class="swiper-wrapper">
                    {{ items }}
                    <div class="swiper-slide group block">
                        <div class="rounded-card">
                            <a href="{{ link }}">
                                <img decoding="async" loading="lazy" src="{{ partial:partials/media-url :file="image" }}" alt="{{ label }}" />
                            </a>
                            <a href="{{ link }}" class="collection-name group-hover:text-violet-900">{{ label }}</a>
                        </div>
                    </div>
                    {{ /items }}
                </div>
            </div>
            <div class="relative arrow pt-16 mx-auto block md:hidden">
                <div class="swiper-button-next"></div>
                <div class="swiper-button-prev"></div>
            </div>
            <div class="grid mx-auto md:mt-10 mt-4 justify-center">
                <a class="all-btn" href="{{ button_url }}">{{ button_label }}</a>
            </div>
        </div>
    </div>
</section>
