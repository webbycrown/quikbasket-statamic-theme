<section class="2xl:py-[50px] 1xl:py-[45px] xl:py-[40px] lg:py-[35px] md:py-[30px] sm:py-[27px] py-[25px] relative">
    <div class="container">
        <div class="heading">
            <h3 class="text-center">{{ heading }}</h3>
        </div>
        <div class="relative testimonial">
            <div class="swiper myClient">
                <div class="swiper-wrapper">
                    {{ quotes }}
                    <div class="swiper-slide">
                        <div class="client-img mx-auto">
                            <img decoding="async" loading="lazy" alt="{{ name }}" src="{{ partial:partials/media-url :file="photo" }}" />
                        </div>
                    </div>
                    {{ /quotes }}
                </div>
            </div>
            <div class="swiper myClient2">
                <div class="swiper-wrapper">
                    {{ quotes }}
                    <div class="swiper-slide">
                        <div class="grid lg:gap-[30px] gap-[20px] text-center">
                            <p class="text-[#374151] 2xl:text-lg lg:text-base text-sm 2xl:leading-8">{{ quote }}</p>
                            <div class="client-info">
                                <h6 class="lg:text-[22px] text-[20px] text-violet-900">{{ name }}</h6>
                                <p class="lg:text-base text-sm font-normal text-[#374151]">{{ role }}</p>
                            </div>
                        </div>
                    </div>
                    {{ /quotes }}
                </div>
            </div>
        </div>
    </div>
</section>
