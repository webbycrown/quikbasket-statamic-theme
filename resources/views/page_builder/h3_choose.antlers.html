<section class="2xl:py-[50px] 1xl:py-[45px] xl:py-[40px] lg:py-[35px] md:py-[30px] sm:py-[27px] py-[25px] relative">
    <div class="bg-violet-400">
        <div class="container">
            <div class="2xl:py-20 1xl:py-16 md:py-12 sm:py-8 py-5">
                <div class="w-[750px] max-w-full mx-auto">
                    <h3 class="text-center sm:mb-[15px] mb-3">{{ heading }}</h3>
                    <p class="text-center xl:text-lg sm:text-base text-[15px] xl:leading-7 leading-6">{{ text }}</p>
                </div>
                <div class="relative flex flex-wrap sm:items-center items-start xl:justify-between justify-center xl:my-[50px] sm:my-10 my-7">
                    {{ items }}
                    <div class="flex flex-col items-center justify-center xl:w-1/5 lg:w-1/4 md:w-1/3 w-1/2 max-w-full 1xl:p-8 md:p-7 p-4">
                        <div class="rounded-full bg-white flex-shrink-0 sm:w-[112px] sm:h-[112px] w-[96px] h-[96px] sm:p-[31px] p-6 flex items-center justify-center">
                            <img decoding="async" loading="lazy" src="{{ partial:partials/media-url :file="icon" }}" alt="" class="w-auto" />
                        </div>
                        <h6 class="font-normal text-center sm:mt-[20px] mt-1 leading-7 sm:w-[99%] w-full max-w-full mx-auto 2xl:text-[20px] sm:text-lg text-[15px]">{{ title }}</h6>
                    </div>
                    {{ /items }}
                </div>
                <div class="flex mx-auto justify-center">
                    <a class="all-btn" href="{{ button_url }}">{{ button_label }}</a>
                </div>
            </div>
        </div>
    </div>
</section>
