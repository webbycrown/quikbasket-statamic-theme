<section class="2xl:py-[50px] 1xl:py-[45px] xl:py-[40px] lg:py-[35px] md:py-[30px] sm:py-[25px] py-[20px]">
    <div class="container">
        <div class="flex lg:flex-row flex-col xl:gap-10 gap-7 w-full 2xl:h-[800px] 1xl:h-[700px] lg:h-[550px]">
            {{ panels }}
            {{ if first }}
            <div class="lg:w-1/2 w-full lg:h-auto md:h-[550px] sm:h-[500px] h-[400px] group">
                <div class="relative bg-[#F1F0EC] w-full h-full">
                    <a href="{{ link }}" class="absolute bottom-0 2xl:right-[67px] 1xl:right-0 xl:right-8 right-2 w-full h-full">
                        <img decoding="async" loading="lazy" src="{{ partial:partials/media-url :file="image" }}" alt="{{ heading }}" class="absolute bottom-0 right-0 block transition-all object-cover 2xl:w-3/4 2xl:h-[91%] 1xl:w-[82%] 1xl:h-[85%] xl:w-[69%] xl:h-[85%] lg:w-[82%] lg:h-[85%] md:w-[58%] sm:w-[64%] w-[72%] sm:h-[95%] h-[88%] mt-auto" />
                    </a>
                    <div class="absolute flex flex-col top-0 1xl:gap-[24px] sm:gap-[20px] gap-4 2xl:w-[45%] lg:w-[65%] md:w-[45%] w-[51%] 2xl:mt-[72px] 1xl:mt-[50px] 2xl:ms-[50px] sm:mt-[40px] sm:ms-[40px] mt-[17px] ms-[17px]">
                        <p class="sm:text-base text-xs font-medium">{{ eyebrow }}</p>
                        <h4 class="1xl:text-xl xl:text-[27px] lg:text-[23px] sm:text-xl text-lg font-medium group-hover:text-violet-900">
                            <a href="{{ link }}">{{ heading }}</a>
                        </h4>
                        <div class="flex 1xl:gap-3 gap-2 items-center group">
                            <a href="{{ link }}" class="group-hover:text-violet-900 uppercase 1xl:text-lg xl:text-[17px] sm:text-base text-[13px] font-normal">{{ button_label }}</a>
                            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="sm:size-5 size-4 group-hover:animate-slide transition duration-300 ease-in-out group-hover:stroke-violet-900" aria-hidden="true">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M13.5 4.5 21 12m0 0-7.5 7.5M21 12H3" />
                            </svg>
                        </div>
                    </div>
                </div>
            </div>
            <div class="flex flex-col xl:gap-10 gap-7 lg:w-1/2 w-full lg:h-auto md:h-[600px] h-[700px]">
            {{ /if }}
            {{ unless first }}
            <div class="relative h-full w-full group">
                <a href="{{ link }}">
                    <img decoding="async" loading="lazy" src="{{ partial:partials/media-url :file="image" }}" alt="{{ heading }}" class="absolute top-0 left-0 bottom-0 right-0 w-full h-full block transition-all object-cover {{ if last }}{{ else }}object-top{{ /if }}" />
                </a>
                <div class="absolute top-0 flex flex-col 1xl:gap-[24px] sm:gap-[18px] gap-[12px] sm:w-[45%] w-[63%] 2xl:mt-[45px] 2xl:ms-[45px] sm:mt-[30px] mt-[20px] sm:ms-[30px] ms-[20px]">
                    <p class="xl:text-base sm:text-[15px] text-xs font-medium">{{ eyebrow }}</p>
                    <h4 class="2xl:text-[30px] 1xl:text-[25px] xl:text-[22px] lg:text-[19px] sm:text-[25px] text-[19px] font-medium group-hover:text-violet-900">
                        <a href="{{ link }}">{{ heading }}</a>
                    </h4>
                    <div class="flex 1xl:gap-3 gap-2 items-center group">
                        <a href="{{ link }}" class="group-hover:text-violet-900 uppercase 1xl:text-lg xl:text-[17px] sm:text-base text-[13px] font-normal">{{ button_label }}</a>
                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="sm:size-5 size-4 group-hover:animate-slide transition duration-300 ease-in-out group-hover:stroke-violet-900" aria-hidden="true">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M13.5 4.5 21 12m0 0-7.5 7.5M21 12H3" />
                        </svg>
                    </div>
                </div>
            </div>
            {{ /unless }}
            {{ if last }}
            </div>
            {{ /if }}
            {{ /panels }}
        </div>
    </div>
</section>
