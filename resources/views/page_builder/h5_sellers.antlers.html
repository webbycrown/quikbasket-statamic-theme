<section class="relative 2xl:py-[50px] 1xl:py-[45px] xl:py-[40px] lg:py-[35px] md:py-[30px] sm:py-[25px] py-[20px]">
    <div class="container z-0">
        <div class="flex md:flex-row flex-col md:gap-0 gap-5 sm:justify-between justify-center items-center w-full md:mb-10 mb-7">
            <h3>{{ heading }}</h3>
            <div class="tabs flex items-center justify-center flex-wrap gap-y-3 divide-black">
                {{ filters }}
                <button type="button" class="filter-button mx-4">
                    <p class="w-full 2xl:text-[20px] lg:text-lg text-base hover:text-black text-[#757575] decoration-yellow-500 underline-offset-8">{{ label }}</p>
                </button>
                {{ /filters }}
            </div>
        </div>
        <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 2xl:grid-cols-5 2xl:gap-8 md:gap-5 gap-6">
            {{ products }}
            {{ partial:partials/product-card }}
            {{ /products }}
        </div>
        <div class="flex justify-center 1xl:mt-[50px] lg:mt-10 mt-7">
            <a href="{{ button_url }}" class="all-btn">{{ button_label }}</a>
        </div>
    </div>
</section>
