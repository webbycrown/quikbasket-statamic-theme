<section class="relative 2xl:py-[50px] 1xl:py-[45px] xl:py-[40px] lg:py-[35px] md:py-[30px] sm:py-[25px] py-[20px]">
    <div class="container">
        <div class="grid lg:grid-cols-2 gap-10 items-center">
            <div>
                <img decoding="async" loading="lazy" src="{{ partial:partials/media-url :file="image" }}" alt="{{ heading }}" class="w-full object-cover" />
            </div>
            <div>
                <h2 class="sm:mb-[15px] mb-3">{{ heading }}</h2>
                {{ if text }}
                <p class="2xl:text-lg text-base mb-8">{{ text }}</p>
                {{ /if }}
                <div class="grid sm:grid-cols-2 gap-6">
                    {{ items }}
                    <div class="flex gap-4 items-start">
                        {{ if icon }}
                        <img decoding="async" loading="lazy" src="{{ partial:partials/media-url :file="icon" }}" alt="" class="w-12 h-12 object-contain flex-shrink-0" />
                        {{ /if }}
                        <div>
                            <h3 class="text-lg font-medium mb-1">{{ title }}</h3>
                            <p class="text-sm text-gray-800">{{ line }}</p>
                        </div>
                    </div>
                    {{ /items }}
                </div>
            </div>
        </div>
    </div>
</section>
