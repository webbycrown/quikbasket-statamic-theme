<section class="relative 2xl:py-[50px] 1xl:py-[45px] xl:py-[40px] lg:py-[35px] md:py-[30px] sm:py-[25px] py-[20px]">
    <div class="container">
        <div class="flex sm:flex-row flex-col sm:items-center justify-between border-b border-lightborder-100 lg:pb-[39px] pb-[20px] mb-[20px] gap-4">
            <div class="flex md:flex-row flex-col md:items-center gap-4">
                <h3>{{ heading }}</h3>
                {{ if timer }}<p class="bg-yellow-400 lg:py-[11px] lg:px-7 py-[10px] px-6">{{ timer }}</p>{{ /if }}
            </div>
            <a class="all-btn" href="{{ button_url }}">{{ button_label }}</a>
        </div>
        <div class="grid lg:grid-cols-2 gap-6">
            <div class="relative min-h-[320px]">
                <img decoding="async" loading="lazy" src="{{ partial:partials/media-url :file="image" }}" alt="{{ banner_heading }}" class="w-full h-full object-cover object-left" />
                <div class="absolute bottom-0 p-6 text-white bg-gradient-to-t from-black/60 to-transparent w-full">
                    <p>{{ eyebrow }}</p>
                    <h3 class="text-white text-2xl my-3">{{ banner_heading }}</h3>
                    <p class="text-xl">{{ price }}</p>
                    <a href="{{ button_url }}" class="underline text-white">{{ banner_button }}</a>
                </div>
            </div>
            <div class="grid sm:grid-cols-2 gap-4">
                {{ products }}
                {{ partial:partials/product-card }}
                {{ /products }}
            </div>
        </div>
    </div>
</section>
