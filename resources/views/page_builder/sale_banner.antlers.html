        <section
            class="2xl:py-[50px] 1xl:py-[45px] xl:py-[40px] lg:py-[35px] md:py-[30px] sm:py-[27px] py-[25px] relative">

                    <div class="relative w-full h-full overflow-hidden flex flex-col-reverse">

                            class="sm:block hidden w-full h-full object-cover absolute inset-0" />
                        <img decoding="async" loading="lazy" src="{{ partial:partials/media-url :file="image_mobile" }}" alt="{{ heading }}"
                            class="block sm:hidden w-full h-full object-cover relative inset-0" />

                        <div
                            class="2xl:w-[43%] 1xl:w-[51%] xl:w-[57%] lg:w-[65%] md:w-3/4 sm:w-[80%] sm:h-full h-1/2 grid items-center w-full relative z-10 2xl:py-24 xl:py-20 lg:py-16 md:py-14 sm:py-10 pt-8 lg:ps-20 sm:ps-8 px-4 top-0 sm:bg-none bg-gradient-to-b from-[#EBD9C3] via-[#EFDDC8] to-[#E9D7C1] bg-fix">

                                    class="uppercase 1xl:text-[22px] sm:text-[20px] text-base sm:mb-4 lg:mb-[22px] mb-[12px] text-violet-900">

                                <h3 class="text-black leading-tight sm:mb-4 mb-[12px] lg:mb-[22px] text-center">
                                    {{ heading }}
                                </h3>
                                <p
                                    class="2xl:text-lg lg:text-base text-sm lg:mb-[22px] xl:mb-[30px] mb-[25px] text-gray-800 text-center block lg:!leading-7">

                    </div>
