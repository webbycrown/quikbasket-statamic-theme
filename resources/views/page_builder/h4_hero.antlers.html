<section class="relative 2xl:pb-[50px] 1xl:pb-[45px] xl:pb-[40px] lg:pb-[35px] md:pb-[30px] sm:pb-[25px] pb-[20px] z-30">
    <div class="bg-violet-400 lg:p-0 pb-6">
        <div class="container">
            <div class="lg:flex grid">
                <div class="w-[17%] 2xl:block hidden"></div>
                <div class="2xl:w-[60%] lg:w-[70%] w-full overflow-hidden">
                    <div class="flex flex-col h-full justify-end">
                        <div class="flex sm:flex-row flex-col-reverse items-center 2xl:gap-[105px] xl:gap-[65px] md:gap-[55px] sm:gap-[40px] gap-1 1xl:px-[103px] xl:px-[51px] md:px-[30px] sm:px-[12px] lg:pt-0 pt-8">
                            <img decoding="async" loading="eager" src="{{ partial:partials/media-url :file="image" }}" alt="{{ heading }}" class="sm:w-[320px] w-full max-w-full xl:h-[408px] sm:h-[370px] h-full max-h-full md:mt-0 sm:mt-6" />
                            <div class="flex flex-col sm:items-start items-center sm:text-start text-center mb-6">
                                <h1 class="md:mb-4 mb-2 xl:text-3xl sm:text-[38px] text-xl 1xl:leading-snug leading-tight">{{ heading }}</h1>
                                <p class="2xl:mb-2.5 md:mb-[17px] mb-4 1xl:text-lg text-base 1xl:leading-7 leading-6">{{ text }}</p>
                                <div class="sm:grid flex md:gap-7 gap-5">
                                    <p class="flex flex-col md:gap-2 gap-1 text-sm text-black font-medium">{{ price_label }}<br /><span class="xl:text-xl lg:text-[28px] text-[20px]">{{ price }}</span></p>
                                    <a class="all-btn" href="{{ button_url }}">{{ button_label }}</a>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="grid lg:grid-cols-2 grid-cols-1">
                {{ cards }}
                <div class="border border-gray-400/20 border-t-0 p-3.5 md:gap-[15px] gap-[9px] flex items-center bg-white lg:w-full w-full group">
                    <div class="overflow-hidden xl:w-[143px] xl:h-[132px] lg:w-[141px] lg:h-[112px] md:w-[146px] md:h-[131px] w-[109px] h-[106px]">
                        <a href="{{ link }}"><img decoding="async" loading="lazy" alt="{{ heading }}" class="group-hover:scale-105 transition-all w-full h-full object-top object-cover" src="{{ partial:partials/media-url :file="image" }}" /></a>
                    </div>
                    <div class="xl:pl-3 pl-1.5 w-3/5">
                        <a href="{{ link }}"><h3 class="2xl:text-[20px] 1xl:text-[19px] lg:text-base md:text-lg sm:text-[17px] text-[15px] lg:mb-2 mb-3 leading-tight font-medium group-hover:text-violet-900">{{ heading }}</h3></a>
                        <p class="text-sm sm:mb-2 mb-1.5 text-black font-normal">{{ price }}</p>
                        <a class="text-sm text-black font-medium underline flex items-center group gap-1 underline-offset-4" href="{{ link }}">{{ button_label }}</a>
                    </div>
                </div>
                {{ /cards }}
            </div>
        </div>
    </div>
</section>
