<section class="2xl:py-[50px] 1xl:py-[45px] xl:py-[40px] lg:py-[35px] md:py-[30px] sm:py-[27px] py-[25px] relative">
    <div class="trending-product relative">
        <div class="container">
            <div class="px-4 flex relative justify-between 2xl:mb-[40px] 1xl:mb-[30px] mb-[20px] items-center">
                <h3 class="sm:text-start text-center">{{ heading }}</h3>
                <div class="relative arrow md:block hidden">
                    <div class="swiper-button-next"></div>
                    <div class="swiper-button-prev pr-[10px]"></div>
                </div>
            </div>
            <div class="swiper myCollection px-4">
                <div class="swiper-wrapper">
                    {{ products }}
                    <div class="mb-5 swiper-slide w-full m-0">
                        {{ partial:partials/h3-product-card }}
                    </div>
                    {{ /products }}
                </div>
            </div>
        </div>
        <div class="relative arrow pt-12 mx-auto block md:hidden mt-4">
            <div class="swiper-button-next"></div>
            <div class="swiper-button-prev"></div>
        </div>
    </div>
</section>
