<section class="relative 2xl:py-[50px] 1xl:py-[45px] xl:py-[40px] lg:py-[35px] md:py-[30px] sm:py-[25px] py-[20px]">
    <div class="container">
        <h2 class="text-center sm:mb-10 mb-6">{{ heading }}</h2>
        <div class="grid 1xl:grid-cols-5 lg:grid-cols-4 md:grid-cols-3 sm:grid-cols-2 grid-cols-1 gap-6">
            {{ members }}
            <div class="text-center group">
                <div class="relative overflow-hidden mb-4">
                    <img decoding="async" loading="lazy" src="{{ partial:partials/media-url :file="photo" }}" alt="{{ name }}" class="w-full aspect-[3/4] object-cover group-hover:scale-105 transition-transform duration-300" />
                </div>
                <h3 class="text-lg font-medium">{{ name }}</h3>
                <p class="text-sm uppercase tracking-wide text-gray-800">{{ role }}</p>
            </div>
            {{ /members }}
        </div>
    </div>
</section>
