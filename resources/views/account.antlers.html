{{ if logged_in }}
{{ partial:partials/crumb }}
<section class="relative 1xl:py-[30px] md:py-[25px] py-[20px]">
    <div class="container">
        <div class="mx-auto flex flex-col w-[640px] max-w-full text-center">
            {{ user }}
            <h1 class="font-medium sm:mb-[18px] mb-[15px]">{{ name ?? email }}</h1>
            <p class="2xl:mb-6 mb-4 2xl:text-lg text-base">{{ email }}</p>
            {{ /user }}
            <p class="2xl:text-lg text-base">
                <a class="border-b border-black hover:text-violet-900" href="/cart">Cart</a>
                or
                <a class="border-b border-black hover:text-violet-900" href="{{ user:logout_url redirect='/' }}">Sign out</a>
            </p>
        </div>
    </div>
</section>
{{ else }}
{{ partial:partials/design-example }}
<p class="text-center pb-10"><a class="border-b border-black hover:text-violet-900" href="/login">Sign in</a></p>
{{ /if }}
