<div class="group">
    <div class="relative">
        <div class="relative w-full h-full before:block before:content-[''] before:pt-full">
            <img decoding="async" loading="lazy" src="/assets/image/{{ file }}" alt=""
                class="z-0 absolute top-0 bottom-0 left-0 right-0 h-full w-full object-cover" aria-hidden="true">
        </div>
        <a href="{{ setting:instagram_url or 'https://www.instagram.com/' }}"
            class="absolute flex items-center justify-center w-full h-full top-0 opacity-0 group-hover:opacity-100 transition-all ease-in-out duration-300 bg-black/45"
            aria-label="Instagram">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true">
                <g fill="none" stroke="white" stroke-width="1.5">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M12 16a4 4 0 1 0 0-8a4 4 0 0 0 0 8" />
                    <path d="M3 16V8a5 5 0 0 1 5-5h8a5 5 0 0 1 5 5v8a5 5 0 0 1-5 5H8a5 5 0 0 1-5-5Z" />
                    <path stroke-linecap="round" stroke-linejoin="round" d="m17.5 6.51l.01-.011" />
                </g>
            </svg>
        </a>
    </div>
</div>
