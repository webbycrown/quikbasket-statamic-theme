<header class="relative z-50">
        <!-- UP-HEADER -->
        <div class="border-b border-lightborder-100 lg:py-1.5 py-1 bg-white">
            <div class="2xl:container px-4">
                <div class="flex md:justify-between justify-end gap-3 items-center 2xl:py-1 py-1.5">
                    <p class="text-sm text-black md:block hidden">
                        Inquiries only. Nothing is charged. |
                        <a href="{{ partial:partials/shop-href }}"
                            class="underline underline-offset-4 hover:text-violet-900 hover:decoration-violet-900">Click
                            and Shop Now.</a>
                    </p>
                    <div class="flex items-center justify-between">
                        <ul class="flex items-center relative top-bar-list">
                            <li>
                                <div class="flex items-center 1xl:gap-[6px] gap-[4px]">
                                    <a href="/account/orders">
                                        <p
                                            class="text-[#282828] button-name text-sm hover:opacity-80 font-normal 2xl:!leading-5">
                                            Order Tracking
                                        </p>
                                    </a>
                                </div>
                            </li>

                            <li class="flex relative lg:m-auto ml-auto">
                                <div @click.away="open = false" x-data="{ open: false, activeIndex: 0, languages: [
                                     { name: 'English', flag: '/assets/image/usa flage.webp' },
                                     { name: 'Argentina', flag: '/assets/image/argentina.svg' },
                                     { name: 'Brazil', flag: '/assets/image/brazil.svg' },
                                     { name: 'Germany', flag: '/assets/image/germany.svg' },
                                     { name: 'Spain', flag: '/assets/image/spain.svg' },
                                     { name: 'France', flag: '/assets/image/france.svg' }
                                    ]}" class="lg:m-auto ml-auto">
                                    <!-- Dropdown Button -->
                                    <button type="button" @click="open = !open" class="group click-dropdown">
                                        <img decoding="async" loading="lazy" src="/assets/image/usa flage.webp" alt="flag" />
                                        <p class="button-name text-[#282828] text-sm font-normal 2xl:!leading-5">
                                            <span x-text="languages[activeIndex].name"></span>
                                        </p>
                                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
                                            stroke-width="3" :class="{'rotate-180': open, 'rotate-0': !open}"
                                            stroke="#282828" class="sm:size-3 size-2.5 duration-200 transform ms-2">
                                            <path stroke-linecap="round" stroke-linejoin="round"
                                                d="m19.5 8.25-7.5 7.5-7.5-7.5" />
                                        </svg>
                                    </button>

                                    <!-- Dropdown Menu -->
                                    <div x-show="open" x-transition:enter="transition ease-out duration-200 transform"
                                        x-transition:enter-start="opacity-0 scale-95 -translate-y-2"
                                        x-transition:enter-end="opacity-100 scale-100 translate-y-0"
                                        x-transition:leave="transition ease-in duration-150 transform"
                                        x-transition:leave-start="opacity-100 scale-100 translate-y-0"
                                        x-transition:leave-end="opacity-0 scale-95 -translate-y-2"
                                        class="right-0 click-drodpwown-menu w-[125%] left-auto">
                                        <!-- Language Items -->
                                        <template x-for="(language, index) in languages" :key="index">
                                            <a href="#" @click.prevent="activeIndex = index; open = false" :class="{
                                               'bg-gray-400 text-white': activeIndex === index, 
                                               'text-gray-700 hover:bg-gray-400 hover:text-white': activeIndex !== index
                                                }" class="group/text">
                                                <img decoding="async" loading="lazy" :src="language.flag" alt="flag"
                                                    class="me-1.5 1xl:w-[20px] w-4" />
                                                <p :class="{'text-white': activeIndex === index, 'text-gray-700 group-hover/text:text-white': activeIndex !== index}"
                                                    class="text-sm">
                                                    <span x-text="language.name"></span>
                                                </p>
                                            </a>
                                        </template>
                                    </div>
                                </div>
                            </li>

                            <li @click.away="open = false" x-data="{ open: false, activeIndex: 0, countries: [
                                    { name: 'USD' },
                                    { name: 'CAD' },
                                    { name: 'ERN' },
                                    { name: 'GMD' },
                                    { name: 'INR' },
                                    { name: 'MVR' }
                                ]}" class="lg:m-auto ml-0 relative">
                                <!-- Dropdown Button -->
                                <button type="button" @click="open = !open" class="group click-dropdown">
                                    <p class="button-name !text-sm text-[#282828] font-normal">
                                        <span x-text="countries[activeIndex].name"></span>
                                    </p>
                                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
                                        stroke-width="3" :class="{'rotate-180': open, 'rotate-0': !open}"
                                        stroke="#282828" class="sm:size-3 size-2.5 duration-200 transform ms-3">
                                        <path stroke-linecap="round" stroke-linejoin="round"
                                            d="m19.5 8.25-7.5 7.5-7.5-7.5" />
                                    </svg>
                                </button>

                                <!-- Dropdown Menu -->
                                <div x-show="open" x-transition:enter="transition ease-out duration-200 transform"
                                    x-transition:enter-start="opacity-0 scale-95 -translate-y-2"
                                    x-transition:enter-end="opacity-100 scale-100 translate-y-0"
                                    x-transition:leave="transition ease-in duration-150 transform"
                                    x-transition:leave-start="opacity-100 scale-100 translate-y-0"
                                    x-transition:leave-end="opacity-0 scale-95 -translate-y-2"
                                    class="click-drodpwown-menu !w-20 !space-y-0 top-[1.8rem]">
                                    <!-- Language Items -->
                                    <template x-for="(country, index) in countries" :key="index">
                                        <a href="#" @click.prevent="activeIndex = index; open = false" :class="{
                                            'text-violet-900': activeIndex === index,
                                            'text-gray-700 hover:text-violet-900': activeIndex !== index
                                            }" class="group/text justify-between">
                                            <p :class="{'text-violet-900': activeIndex === index, 'text-gray-700 group-hover/text:text-violet-900': activeIndex !== index}"
                                                class="text-sm text-start px-1">
                                                <span x-text="country.name"></span>
                                            </p>
                                            <span
                                                :class="{'opacity-100': activeIndex === index, 'opacity-0': activeIndex !== index}"
                                                aria-hidden="true" class="text-inherit w-3 h-3 flex-shrink-0">
                                                <svg aria-hidden="true" data-selected="true" role="presentation"
                                                    viewBox="0 0 17 18">
                                                    <polyline fill="none" points="1 9 7 14 15 4" stroke="currentColor"
                                                        stroke-dasharray="22" stroke-dashoffset="44"
                                                        stroke-linecap="round" stroke-linejoin="round"
                                                        stroke-width="1.5" style="transition: stroke-dashoffset 200ms">
                                                    </polyline>
                                                </svg>
                                            </span>
                                        </a>
                                    </template>
                                </div>
                            </li>
                        </ul>
                    </div>
                </div>
            </div>
        </div>

        <!-- MIDDLE-HEADER -->
        <div class="2xl:container 2xl:px-0 px-4 relative bg-white" id="nav">
            <div class="header-middle w-full">
                <div class="flex items-center justify-between lg:py-7 md:py-4 py-[15px] transition-all">
                    <!-- First Button: Opens the navbar -->
                    <div class="site-logo">
                        <a href="{{ partial:partials/page-href id='home-four' }}">
                            <img decoding="async" loading="lazy" src="{{ partial:partials/media-url :file="setting:logo" fallback="image/main-logo.svg" }}" alt="main-logo"
                                title="main-logo" class="1xl:w-[229px] xl:w-[215px] sm:w-[185px] w-[135px] m-auto" />
                        </a>
                    </div>

                    <!-- SEARCH-FAVOURITE PRODUCT AND CATEGORY -->
                    <div
                        class="hidden lg:flex items-normal justify-between bg-violet-400 px-4 2xl:w-1/3 1xl:w-[40%] w-[38%] divide-x divide-gray-400/30">
                        <div class="flex items-center gap-3 w-full">
                            <img decoding="async" loading="lazy" src="/assets/image/search-black.svg" alt="search" />
                            <input type="search" name="search" placeholder="Search favourite product..."
                                class="w-full pe-2 xl:py-2.5 py-2 1xl:placeholder:text-[15px] placeholder:text-sm placeholder:text-[#757575] placeholder:font-normal bg-violet-400" />
                        </div>
                        <li class="flex relative">
                            <div @click.away="open = false" x-data="{ open: false, activeIndex: 0, languages: [
                                { name: 'Select Categories' },
                                { name: 'Category 1' },
                                { name: 'Category 2'},
                                { name: 'Category 3' },
                            ]}" class="m-auto w-[155px] max-w-full">
                                <!-- Dropdown Button -->
                                <button type="button" @click="open = !open"
                                    class="group click-dropdown ps-2 justify-end">
                                    <p class="button-name 1xl:text-[15px] text-sm text-[#757575] font-normal">
                                        <span x-text="languages[activeIndex].name"></span>
                                    </p>
                                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
                                        stroke-width="3" :class="{'rotate-180': open, 'rotate-0': !open}"
                                        stroke="#757575" class="sm:size-3 size-2.5 duration-200 transform ms-2">
                                        <path stroke-linecap="round" stroke-linejoin="round"
                                            d="m19.5 8.25-7.5 7.5-7.5-7.5" />
                                    </svg>
                                </button>

                                <!-- Dropdown Menu -->
                                <div x-show="open" x-transition:enter="transition ease-out duration-200 transform"
                                    x-transition:enter-start="opacity-0 scale-95 -translate-y-2"
                                    x-transition:enter-end="opacity-100 scale-100 translate-y-0"
                                    x-transition:leave="transition ease-in duration-150 transform"
                                    x-transition:leave-start="opacity-100 scale-100 translate-y-0"
                                    x-transition:leave-end="opacity-0 scale-95 -translate-y-2"
                                    class="click-drodpwown-menu2 xl:top-11 top-10 w-full left-auto">
                                    <!-- Language Items -->
                                    <template x-for="(language, index) in languages" :key="index">
                                        <a href="#" @click.prevent="activeIndex = index; open = false" :class="{
                                            'text-violet-900': activeIndex === index, 
                                            'text-gray-700 hover:violet-900': activeIndex !== index
                                        }" class="group/text">
                                            <p :class="{'text-violet-900': activeIndex === index, 'text-gray-700 group-hover/text:text-violet-900': activeIndex !== index}"
                                                class="text-sm">
                                                <span x-text="language.name"></span>
                                            </p>
                                        </a>
                                    </template>
                                </div>
                            </div>
                        </li>
                    </div>

                    <ul class="flex items-start justify-end lg:mr-[10px] space-x-2 sm:space-x-4 xl:space-x-6">
                        <li class="lg:hidden">
                            <div class="flex items-center gap-4 xl:border-l border-lightborder-100/25"
                                id="extra-options">
                                <button id="openModalButton" class="bg-transparent text-white">
                                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16"
                                        class="lg:w-[22px] lg:h-[22px] sm:w-[20px] sm:h-[20px] w-[18px] h-[18px] fill-black hover:fill-violet-900">
                                        <path fill-rule="evenodd"
                                            d="M6.5 2a4.5 4.5 0 1 0 0 9a4.5 4.5 0 0 0 0-9M1 6.5a5.5 5.5 0 1 1 9.727 3.52l3.127 3.126l-.708.708l-3.126-3.127A5.5 5.5 0 0 1 1 6.5"
                                            clip-rule="evenodd" />
                                    </svg>
                                </button>
                                <div id="modal" class="main-modal hidden">
                                    <div class="modal">
                                        <!-- Close Button -->
                                        <button id="closeModalButton" class="closeModalButton">
                                            ✕
                                        </button>
                                        <form class="modal-form" method="get" action="/shop">
                                            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16"
                                                class="1xl:w-[22px] sm:w-[19px] w-[17px] fill-black hover:fill-violet-900 sm:me-3 me-1 my-auto">
                                                <path fill-rule="evenodd"
                                                    d="M6.5 2a4.5 4.5 0 1 0 0 9a4.5 4.5 0 0 0 0-9M1 6.5a5.5 5.5 0 1 1 9.727 3.52l3.127 3.126l-.708.708l-3.126-3.127A5.5 5.5 0 0 1 1 6.5"
                                                    clip-rule="evenodd" />
                                            </svg>
                                            <label class="relative block w-full h-full">
                                                <input placeholder="Search the shop" type="search" name="q" aria-label="Search the shop"
                                                    class="placeholder:text-grey-400" />
                                            </label>
                                        </form>
                                    </div>
                                </div>
                            </div>
                        </li>
                        <li class="group">
                            <a href="{{ if logged_in }}/account{{ else }}/login{{ /if }}">
                                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"
                                    class="2xl:w-[28px] 1xl:w-[24px] xl:w-[22px] sm:w-[21px] w-[18px] stroke-black group-hover:stroke-violet-900">
                                    <g fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5">
                                        <circle cx="12" cy="8" r="5" />
                                        <path d="M20 21a8 8 0 1 0-16 0m16 0a8 8 0 1 0-16 0" />
                                    </g>
                                </svg>
                            </a>
                        </li>
                        <li class="group">
                            <a href="/wishlist" class="relative">
                                <svg xmlns="http://www.w3.org/2000/svg"
                                    class="2xl:w-[28px] 1xl:w-[24px] xl:w-[22px] sm:w-[21px] w-[18px] header-icons fill-black group-hover:fill-violet-900"
                                    viewBox="0 0 36 36">
                                    <path stroke="none"
                                        d="M18 32.43a1 1 0 0 1-.61-.21C11.83 27.9 8 24.18 5.32 20.51C1.9 15.82 1.12 11.49 3 7.64c1.34-2.75 5.19-5 9.69-3.69A9.87 9.87 0 0 1 18 7.72a9.87 9.87 0 0 1 5.31-3.77c4.49-1.29 8.35.94 9.69 3.69c1.88 3.85 1.1 8.18-2.32 12.87c-2.68 3.67-6.51 7.39-12.07 11.71a1 1 0 0 1-.61.21M10.13 5.58A5.9 5.9 0 0 0 4.8 8.51c-1.55 3.18-.85 6.72 2.14 10.81A57 57 0 0 0 18 30.16a57 57 0 0 0 11.06-10.83c3-4.1 3.69-7.64 2.14-10.81c-1-2-4-3.59-7.34-2.65a8 8 0 0 0-4.94 4.2a1 1 0 0 1-1.85 0a7.93 7.93 0 0 0-4.94-4.2a7.3 7.3 0 0 0-2-.29"
                                        class="clr-i-outline clr-i-outline-path-1" />
                                    <path fill="none" d="M0 0h36v36H0z" />
                                </svg>
                            </a>
                        </li>
                        <li class="group">
                            <a href="/cart" class="relative">
                                <svg xmlns="http://www.w3.org/2000/svg"
                                    class="2xl:w-[27px] 1xl:w-[22px] xl:w-[21px] lg:w-[20px] sm:w-[19px] w-[17px] header-icons group-hover:stroke-violet-900 stroke-black"
                                    viewBox="0 0 24 24">
                                    <path stroke-width="1.5" fill="none"
                                        d="M2 12h20l-2 11H4zm18-4l-6-7M4 8l6-7M1 8h22v4H1zm7 7v5m8-5v5m-4-5v5" />
                                </svg>
                            </a>
                        </li>
                    </ul>
                </div>
            </div>
        </div>

        <!-- DOWN-HEADER -->
        <nav class="relative bg-violet-900 w-full border-y border-lightborder-200 flex items-center">
            <div class="2xl:container px-4 w-full">
                <div class="mx-auto flex justify-between items-center">
                    

                    {{ partial:partials/all-categories tone="ink" }}

                    <!-- Links Section -->
                    <div id="navMenu"
                        class="lg:flex lg:flex-row justify-start 1xl:m-0 lg:overflow-hidden overflow-auto lg:justify-end 1xl:h-[51px] lg:h-[46px] h-full fixed inset-0 bg-white z-40 animate-slide xl:m-0 lg:m-auto flex-col items-center lg:static space-y-0 2xl:space-x-8 lg:space-x-3 lg:bg-transparent lg:p-0 lg:divide-y-0 divide-y divide-lightborder-100 ml-0">
                        <div class="flex items-center justify-between w-full lg:hidden bg-violet-400 p-4">
                            <div class="site-logo lg:hidden block">
                                <a href="/">
                                    <img decoding="async" loading="lazy" src="{{ partial:partials/media-url :file="setting:logo" fallback="image/main-logo.svg" }}" alt="main-logo"
                                        title="main-logo"
                                        class="1xl:w-[229px] xl:w-[215px] sm:w-[185px] w-[135px] m-auto" />
                                </a>
                            </div>
                            <button type="button" aria-label="Close menu" id="menuClose" class="self-end lg:hidden">
                                <svg class="w-6 h-6 text-gray-800" fill="none" stroke="currentColor" viewBox="0 0 24 24"
                                    xmlns="http://www.w3.org/2000/svg">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                        d="M6 18L18 6M6 6l12 12"></path>
                                </svg>
                            </button>
                        </div>

                        {{ partial:partials/shop-nav variant="home7" }}

                        
                    </div>

                    <div class="lg:hidden flex">
                        <button id="menuToggle" class="text-gray-800">
                            <svg class="sm:w-5 sm:h-5 w-4 h-4" aria-hidden="true" xmlns="http://www.w3.org/2000/svg"
                                fill="none" viewBox="0 0 17 14">
                                <path stroke="white" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                    d="M1 1h15M1 7h15M1 13h15" />
                            </svg>
                        </button>
                    </div>
                    <div
                        class="all-btn bg-white text-black hover:text-white hover:border-white text-center lg:block hidden 2xl:text-[17px] 1xl:text-[15px] text-[13px] 1xl:px-9 px-3">
                        <a href="{{ partial:partials/shop-href }}">Shop Now</a>
                    </div>
                </div>
            </div>
        </nav>
    </header>
