{{ if total_pages > 1 }}
<nav class="pagination flex flex-wrap justify-center space-x-2 mt-[50px] col-span-full w-full" aria-label="Pagination">
    {{ if prev_page }}
    <a href="{{ prev_page }}" class="pagination-item px-2 py-2 border border-lightborder-100 bg-white hover:bg-violet-900 group" aria-label="Previous page">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" class="fill-black group-hover:fill-white group-hover:animate-slideLeft 1xl:w-[22px] xl:w-[19px] w-[16px]" aria-hidden="true">
            <path d="M529.408 149.376a29.12 29.12 0 0 1 41.728 0a30.59 30.59 0 0 1 0 42.688L259.264 511.936l311.872 319.936a30.59 30.59 0 0 1-.512 43.264a29.12 29.12 0 0 1-41.216-.512L197.76 534.272a32 32 0 0 1 0-44.672zm256 0a29.12 29.12 0 0 1 41.728 0a30.59 30.59 0 0 1 0 42.688L515.264 511.936l311.872 319.936a30.59 30.59 0 0 1-.512 43.264a29.12 29.12 0 0 1-41.216-.512L453.76 534.272a32 32 0 0 1 0-44.672z" />
        </svg>
    </a>
    {{ else }}
    <span class="pagination-item px-2 py-2 border border-lightborder-100 bg-white opacity-40 pointer-events-none" aria-hidden="true">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" class="fill-black 1xl:w-[22px] xl:w-[19px] w-[16px]">
            <path d="M529.408 149.376a29.12 29.12 0 0 1 41.728 0a30.59 30.59 0 0 1 0 42.688L259.264 511.936l311.872 319.936a30.59 30.59 0 0 1-.512 43.264a29.12 29.12 0 0 1-41.216-.512L197.76 534.272a32 32 0 0 1 0-44.672zm256 0a29.12 29.12 0 0 1 41.728 0a30.59 30.59 0 0 1 0 42.688L515.264 511.936l311.872 319.936a30.59 30.59 0 0 1-.512 43.264a29.12 29.12 0 0 1-41.216-.512L453.76 534.272a32 32 0 0 1 0-44.672z" />
        </svg>
    </span>
    {{ /if }}

    {{ links:all }}
        {{ if page == current_page }}
        <span class="pagination-item active px-4 py-2 border border-lightborder-100 sm:text-[16px] text-[10px]" aria-current="page">{{ page }}</span>
        {{ else }}
        <a href="{{ url }}" class="pagination-item px-4 py-2 bg-white border border-lightborder-100 hover:bg-violet-900 hover:text-white sm:text-[16px] text-[10px]">{{ page }}</a>
        {{ /if }}
    {{ /links:all }}

    {{ if next_page }}
    <a href="{{ next_page }}" class="pagination-item px-2 py-2 border border-lightborder-100 bg-white hover:bg-violet-900 group" aria-label="Next page">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" class="fill-black group-hover:fill-white group-hover:animate-slideRight 1xl:w-[22px] xl:w-[19px] w-[16px]" aria-hidden="true">
            <path d="M452.864 149.312a29.12 29.12 0 0 1 41.728.064L826.24 489.664a32 32 0 0 1 0 44.672L494.592 874.624a29.12 29.12 0 0 1-41.728 0a30.59 30.59 0 0 1 0-42.752L764.736 512L452.864 192a30.59 30.59 0 0 1 0-42.688m-256 0a29.12 29.12 0 0 1 41.728.064L570.24 489.664a32 32 0 0 1 0 44.672L238.592 874.624a29.12 29.12 0 0 1-41.728 0a30.59 30.59 0 0 1 0-42.752L508.736 512L196.864 192a30.59 30.59 0 0 1 0-42.688" />
        </svg>
    </a>
    {{ else }}
    <span class="pagination-item px-2 py-2 border border-lightborder-100 bg-white opacity-40 pointer-events-none" aria-hidden="true">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" class="fill-black 1xl:w-[22px] xl:w-[19px] w-[16px]">
            <path d="M452.864 149.312a29.12 29.12 0 0 1 41.728.064L826.24 489.664a32 32 0 0 1 0 44.672L494.592 874.624a29.12 29.12 0 0 1-41.728 0a30.59 30.59 0 0 1 0-42.752L764.736 512L452.864 192a30.59 30.59 0 0 1 0-42.688m-256 0a29.12 29.12 0 0 1 41.728.064L570.24 489.664a32 32 0 0 1 0 44.672L238.592 874.624a29.12 29.12 0 0 1-41.728 0a30.59 30.59 0 0 1 0-42.752L508.736 512L196.864 192a30.59 30.59 0 0 1 0-42.688" />
        </svg>
    </span>
    {{ /if }}
</nav>
{{ /if }}
