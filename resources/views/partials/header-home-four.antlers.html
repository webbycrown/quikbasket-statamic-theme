<header class="relative z-50">
        <!-- UP-HEADER -->
        <div class="border-b border-lightborder-100 bg-white">
            <div class="2xl:container px-4">
                <div class="flex justify-between items-center 2xl:py-2 py-1">
                    <p class="1xl:text-[15px] text-sm lg:block hidden text-[#282828]">Discount up to 35% for first purchase only this month.</p>
                    <div class="flex items-center justify-between lg:w-auto w-full">
                        <ul class="flex items-center relative lg:w-auto w-full top-bar-list">
                            <li>
                                <a href="mailto:{{ setting:email }}" class="flex items-center 1xl:gap-[6px] gap-[4px]">
                                    <img decoding="async" loading="lazy" src="/assets/image/mail.svg" alt="mail"
                                        class="sm:w-5 sm:h-5 w-[18px] h-[18px]" />
                                    <span
                                        class="text-[#282828] xl:text-sm text-xs hover:opacity-80 font-normal sm:leading-[26px] xl:block hidden">info@quikbasket.com</span>
                                </a>
                            </li>
                            <!-- <li class="text-gray-400/20 xl:mx-4 md:mx-3 sm:mx-1 mx-0.5 inline-block">|</li> -->

                            <li>
                                <div class="flex items-center 1xl:gap-[6px] gap-[4px]">
                                    <a href="/shop">
                                        <img decoding="async" loading="lazy" src="/assets/image/location-pin.svg" alt="store"
                                            class="sm:w-5 sm:h-5 w-[18px] h-[18px]" />
                                    </a>
                                    <a href="/shop">
                                        <p
                                            class="text-[#282828] xl:text-sm text-xs hover:opacity-80 font-normal sm:leading-[26px] xl:block hidden">
                                            Store Locator</p>
                                    </a>
                                </div>
                            </li>
                            <!-- <li class="text-gray-400/20 xl:mx-4 md:mx-3 sm:mx-1 mx-0.5 inline-block">|</li> -->

                            <li class="border-r border-lightborder-100">
                                <div class="flex items-center 1xl:gap-[6px] gap-[4px] pr-3">
                                    <a href="/shop">
                                        <img decoding="async" loading="lazy" src="/assets/image/order-truck.svg" alt="order"
                                            class="sm:w-5 sm:h-5 w-[18px] h-[18px]" />

                                    </a>
                                    <a href="/account">
                                        <p
                                            class="text-[#282828] xl:text-sm text-xs hover:opacity-80 font-normal sm:leading-[26px] xl:block hidden">
                                            Order Tracking</p>
                                    </a>
                                </div>
                            </li>
                        </ul>
                        <ul class="flex items-center relative lg:w-auto w-full top-bar-list 1xl:pl-4 pl-3">
                            <!-- <li class="text-gray-400/20 xl:mx-4 md:mx-3 sm:mx-1 mx-0.5 inline-block">|</li> -->
                            <li class="flex relative lg:m-auto ml-auto lg:!border-0">
                                <div @click.away="open = false" x-data="{ open: false, activeIndex: 0, languages: [
                                { name: 'English', flag: '/assets/image/usa flage.webp' },
                                { name: 'Argentina', flag: '/assets/image/argentina.svg' },
                                { name: 'Brazil', flag: '/assets/image/brazil.svg' },
                                { name: 'Germany', flag: '/assets/image/germany.svg' },
                                { name: 'Spain', flag: '/assets/image/spain.svg' },
                                { name: 'France', flag: '/assets/image/france.svg' }
                            ]}" class="lg:m-auto ml-auto">
                                    <!-- Dropdown Button -->
                                    <button type="button" @click="open = !open" class="group click-dropdown">
                                        <img decoding="async" loading="lazy" loading="lazy" src="/assets/image/usa flage.webp"
                                            alt="flag" />
                                        <p class="button-name text-[#282828] text-sm font-normal">
                                            <span x-text="languages[activeIndex].name"></span>
                                        </p>
                                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
                                            stroke-width="3" :class="{'rotate-180': open, 'rotate-0': !open}"
                                            stroke="#282828" class="sm:size-3 size-2.5 duration-200 transform ms-2">
                                            <path stroke-linecap="round" stroke-linejoin="round"
                                                d="m19.5 8.25-7.5 7.5-7.5-7.5" />
                                        </svg>
                                    </button>

                                    <!-- Dropdown Menu -->
                                    <div x-show="open" x-transition:enter="transition ease-out duration-200 transform"
                                        x-transition:enter-start="opacity-0 scale-95 -translate-y-2"
                                        x-transition:enter-end="opacity-100 scale-100 translate-y-0"
                                        x-transition:leave="transition ease-in duration-150 transform"
                                        x-transition:leave-start="opacity-100 scale-100 translate-y-0"
                                        x-transition:leave-end="opacity-0 scale-95 -translate-y-2"
                                        class="right-0 click-drodpwown-menu w-[125%] left-auto">
                                        <!-- Language Items -->
                                        <template x-for="(language, index) in languages" :key="index">
                                            <a href="#" @click.prevent="activeIndex = index; open = false" :class="{
                                            'bg-gray-400 text-white': activeIndex === index, 
                                            'text-gray-700 hover:bg-gray-400 hover:text-white': activeIndex !== index
                                                    }" class="group/text">
                                                <img decoding="async" loading="lazy" loading="lazy" :src="language.flag"
                                                    alt="flag" class="me-1.5 1xl:w-[20px] w-4" />
                                                <p :class="{'text-white': activeIndex === index, 'text-gray-700 group-hover/text:text-white': activeIndex !== index}"
                                                    class="text-sm">
                                                    <span x-text="language.name"></span>
                                                </p>
                                            </a>
                                        </template>
                                    </div>
                                </div>
                            </li>

                            <li @click.away="open = false" x-data="{ open: false, activeIndex: 0, countries: [
                            { name: 'USD' },
                            { name: 'CAD' },
                            { name: 'ERN' },
                            { name: 'GMD' },
                            { name: 'INR' },
                            { name: 'MVR' }
                                    ]}" class="lg:m-auto ml-0 relative">
                                <!-- Dropdown Button -->
                                <button type="button" @click="open = !open" class="group click-dropdown">
                                    <p class="button-name !text-sm text-[#282828] font-normal">
                                        <span x-text="countries[activeIndex].name"></span>
                                    </p>
                                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
                                        stroke-width="3" :class="{'rotate-180': open, 'rotate-0': !open}"
                                        stroke="#282828" class="sm:size-3 size-2.5 duration-200 transform ms-3">
                                        <path stroke-linecap="round" stroke-linejoin="round"
                                            d="m19.5 8.25-7.5 7.5-7.5-7.5" />
                                    </svg>
                                </button>

                                <!-- Dropdown Menu -->
                                <div x-show="open" x-transition:enter="transition ease-out duration-200 transform"
                                    x-transition:enter-start="opacity-0 scale-95 -translate-y-2"
                                    x-transition:enter-end="opacity-100 scale-100 translate-y-0"
                                    x-transition:leave="transition ease-in duration-150 transform"
                                    x-transition:leave-start="opacity-100 scale-100 translate-y-0"
                                    x-transition:leave-end="opacity-0 scale-95 -translate-y-2"
                                    class="click-drodpwown-menu !w-20 !space-y-0 top-[1.8rem]">
                                    <!-- Language Items -->
                                    <template x-for="(country, index) in countries" :key="index">
                                        <a href="#" @click.prevent="activeIndex = index; open = false" :class="{
                                    ' text-violet-900': activeIndex === index,
                                        'text-gray-700 hover:text-violet-900': activeIndex !== index
                                    }" class="group/text justify-between">
                                            <p :class="{'text-violet-900': activeIndex === index, 'text-gray-700 group-hover/text:text-violet-900': activeIndex !== index}"
                                                class="text-sm text-start px-1">
                                                <span x-text="country.name"></span>
                                            </p>
                                            <span
                                                :class="{'opacity-100': activeIndex === index, 'opacity-0': activeIndex !== index}"
                                                aria-hidden="true" class="text-inherit w-3 h-3 flex-shrink-0"><svg
                                                    aria-hidden="true" data-selected="true" role="presentation"
                                                    viewBox="0 0 17 18">
                                                    <polyline fill="none" points="1 9 7 14 15 4" stroke="currentColor"
                                                        stroke-dasharray="22" stroke-dashoffset="44"
                                                        stroke-linecap="round" stroke-linejoin="round"
                                                        stroke-width="1.5" style="transition: stroke-dashoffset 200ms;">
                                                    </polyline>
                                                </svg>
                                            </span>
                                    </template>
                                </div>
                            </li>
                        </ul>
                    </div>
                </div>
            </div>
        </div>

        <!-- MIDDLE-HEADER -->
        <div class="2xl:container 2xl:px-0 px-4 relative z-50 bg-white" id="nav">
            <div class="header-middle w-full">
                <div class="flex items-center justify-between md:py-4 py-3 lg:py-7 transition-all">
                    <!-- First Button: Opens the navbar -->
                    <div class="site-logo">
                        <a href="/home-four">
                            <img decoding="async" loading="lazy" src="{{ partial:partials/media-url :file="setting:logo" fallback="image/main-logo.svg" }}" alt="main-logo"
                                title="main-logo" class="1xl:w-[229px] xl:w-[215px] sm:w-[185px] w-[135px] m-auto" />
                        </a>
                    </div>

                    <!-- SEARCH-FAVOURITE PRODUCT AND CATEGORY -->
                    <div
                        class="hidden lg:flex items-center justify-between border border-gray-400/20 rounded-full py-2.5 px-4 2xl:w-1/3 1xl:w-[40%] w-[38%] divide-x divide-gray-400/20">
                        <div class="flex items-center gap-3 w-full">
                            <img decoding="async" loading="lazy" src="/assets/image/search-black.svg" alt="search" />
                            <input type="search" name="search" placeholder="Search favourite product..."
                                class="w-full pe-2 1xl:placeholder:text-[15px] placeholder:text-sm placeholder:text-[#374151B2] placeholder:font-normal" />
                        </div>
                        <li class="flex relative">
                            <div @click.away="open = false" x-data="{ open: false, activeIndex: 0, languages: [
                                { name: 'Select Categories' },
                                { name: 'Category 1' },
                                { name: 'Category 2'},
                                { name: 'Category 3' },
                            ]}" class="m-auto 1xl:w-[163px] w-[155px] max-w-full">
                                <!-- Dropdown Button -->
                                <button type="button" @click="open = !open" class="group click-dropdown px-2">
                                    <p class="button-name 1xl:text-[15px] text-sm text-[#374151B2] font-normal">
                                        <span x-text="languages[activeIndex].name"></span>
                                    </p>
                                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
                                        stroke-width="3" :class="{'rotate-180': open, 'rotate-0': !open}"
                                        stroke="#374151B2" class="sm:size-3 size-2.5 duration-200 transform ms-2">
                                        <path stroke-linecap="round" stroke-linejoin="round"
                                            d="m19.5 8.25-7.5 7.5-7.5-7.5" />
                                    </svg>
                                </button>

                                <!-- Dropdown Menu -->
                                <div x-show="open" x-transition:enter="transition ease-out duration-200 transform"
                                    x-transition:enter-start="opacity-0 scale-95 -translate-y-2"
                                    x-transition:enter-end="opacity-100 scale-100 translate-y-0"
                                    x-transition:leave="transition ease-in duration-150 transform"
                                    x-transition:leave-start="opacity-100 scale-100 translate-y-0"
                                    x-transition:leave-end="opacity-0 scale-95 -translate-y-2"
                                    class="click-drodpwown-menu2 top-8 w-full left-auto">
                                    <!-- Language Items -->
                                    <template x-for="(language, index) in languages" :key="index">
                                        <a href="#" @click.prevent="activeIndex = index; open = false" :class="{
                                            'text-violet-900': activeIndex === index, 
                                            'text-gray-700 hover:violet-900': activeIndex !== index
                                        }" class="group/text">
                                            <p :class="{'text-violet-900': activeIndex === index, 'text-gray-700 group-hover/text:text-violet-900': activeIndex !== index}"
                                                class="text-sm">
                                                <span x-text="language.name"></span>
                                            </p>
                                        </a>
                                    </template>
                                </div>
                            </div>
                        </li>

                    </div>

                    <div class="flex items-center justify-center sm:gap-2 gap-1">
                        <div class="lg:hidden">
                            <div class="flex items-center gap-4 lg:border-l border-lightborder-100/25"
                                id="extra-options">
                                <button id="openModalButton" class="bg-transparent text-white">
                                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16"
                                        class="lg:w-[22px] lg:h-[22px] sm:w-[20px] sm:h-[20px] w-[18px] h-[18px] fill-black hover:fill-violet-900">
                                        <path fill-rule="evenodd"
                                            d="M6.5 2a4.5 4.5 0 1 0 0 9a4.5 4.5 0 0 0 0-9M1 6.5a5.5 5.5 0 1 1 9.727 3.52l3.127 3.126l-.708.708l-3.126-3.127A5.5 5.5 0 0 1 1 6.5"
                                            clip-rule="evenodd" />
                                    </svg>
                                </button>
                                <div id="modal" class="main-modal lg:absolute hidden">
                                    <div class="modal">
                                        <!-- Close Button -->
                                        <button id="closeModalButton" class="closeModalButton">✕</button>
                                        <form class="modal-form" method="get" action="/shop">
                                            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16"
                                                class="1xl:w-[22px] sm:w-[19px] w-[17px] fill-black hover:fill-violet-900 sm:me-3 me-1 my-auto pt-[3px]">
                                                <path fill-rule="evenodd"
                                                    d="M6.5 2a4.5 4.5 0 1 0 0 9a4.5 4.5 0 0 0 0-9M1 6.5a5.5 5.5 0 1 1 9.727 3.52l3.127 3.126l-.708.708l-3.126-3.127A5.5 5.5 0 0 1 1 6.5"
                                                    clip-rule="evenodd" />
                                            </svg>
                                            <label class="relative block w-full h-full">
                                                <input placeholder="Search the shop" type="search" name="q" aria-label="Search the shop"
                                                    class="placeholder:text-grey-400" />
                                            </label>
                                        </form>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <a href="/account/orders" class="lg:hover:border-violet-900 lg:border border-violet-400 rounded-full lg:bg-[#EFECE7] flex items-center justify-center
                            lg:w-[37px] lg:h-[37px] p-1">
                            <img decoding="async" loading="lazy" src="/assets/image/repeat.svg" alt="repeat-order"
                                class="sm:w-5 sm:h-5 w-[17px] h-[17px]" />
                        </a>
                        <a href="/wishlist" class="lg:hover:border-violet-900 lg:border border-violet-400 rounded-full lg:bg-[#EFECE7] flex items-center justify-center
                            lg:w-[37px] lg:h-[37px] p-1">
                            <img decoding="async" loading="lazy" src="/assets/image/wishlist.svg" alt="wishlist"
                                class="sm:w-5 sm:h-5 w-[17px] h-[17px]" />
                        </a>

                        <a href="{{ if logged_in }}/account{{ else }}/login{{ /if }}" class="lg:hover:border-violet-900 lg:border border-violet-400 rounded-full lg:bg-[#EFECE7] flex items-center justify-center
                            lg:w-[37px] lg:h-[37px] p-1">
                            <img decoding="async" loading="lazy" src="/assets/image/account.svg" alt="account"
                                class="sm:w-5 sm:h-5 w-[17px] h-[17px]" />
                        </a>

                        <div class="flex items-center lg:ms-4">
                            <a href="/cart" class="relative">
                                <img decoding="async" loading="lazy" src="/assets/image/cart.svg" alt="right-item-alt"
                                    title="right-item-title"
                                    class="lg:w-6 lg:h-6 sm:w-[21px] sm:h-[21px] h-[20px] w-[95%]" />
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- DOWN-HEADER -->
        <nav class="relative bg-violet-900 w-full border-y border-lightborder-200 flex items-center">
            <div class="2xl:container px-4 w-full">
                <div class="mx-auto flex justify-between items-center">
                    

                    <!-- Links Section -->
                    <div id="navMenu" class="nav-menu lg:flex lg:flex-row mx-auto 1xl:m-0">
                        <div class="flex items-center justify-between w-full lg:hidden bg-violet-400 p-4">
                            <div class="site-logo lg:hidden block">
                                <a href="/">
                                    <img decoding="async" loading="lazy" loading="lazy" src="{{ partial:partials/media-url :file="setting:logo" fallback="image/main-logo.svg" }}"
                                        alt="main-logo" title="main-logo"
                                        class="1xl:w-[229px] xl:w-[215px] sm:w-[185px] w-[135px] m-auto" />
                                </a>
                            </div>
                            <button type="button" aria-label="Close menu" id="menuClose" class="self-end lg:hidden">
                                <svg class="w-6 h-6 text-gray-800" fill="none" stroke="currentColor" viewBox="0 0 24 24"
                                    xmlns="http://www.w3.org/2000/svg">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                        d="M6 18L18 6M6 6l12 12"></path>
                                </svg>
                            </button>
                        </div>

                        <!-- 1ST -->
                        <div class="group/product dropdown-toggle mx-0">
                            <button type="button" aria-expanded="false" id="dropdownToggle1"
                                class="lg:group-hover/product:border-violet-900 lg:group-focus/product:border-violet-900 lg:group-active/product:border-violet-900">
                                <p
                                    class="group-hover/product:text-violet-900 group-focus/product:text-violet-900 group-active/product:text-violet-900 lg:!text-white">
                                    Pages
                                </p>
                                <svg class="group-hover/product:rotate-180 group-hover/product:stroke-violet-900 lg:!stroke-white"
                                    fill="none" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                        d="M19 9l-7 7-7-7"></path>
                                </svg>
                            </button>
                            <!-- Dropdown -->
                            <div id="dropdownMenu1"
                                class="dropdown-mainmenu hidden lg:group-hover/product:block lg:w-[190px] lg:left-auto lg:right-auto">
                                <div class="lg:mb-0 mb-3">
                                    <h6 class="product-heading">Home
                                        Pages</h6>
                                    {{ partial:partials/page-nav }}
                                </div>
                            </div>
                        </div>

                        <!-- 2ND -->
                        <div class="group/product dropdown-toggle">
                            <button type="button" aria-expanded="false" id="dropdownToggle2"
                                class="lg:group-hover/product:border-violet-900 lg:group-focus/product:border-violet-900 lg:group-active/product:border-violet-900">
                                <p
                                    class="group-hover/product:text-violet-900 group-focus/product:text-violet-900 group-active/product:text-violet-900 lg:!text-white">
                                    New Arrivals
                                </p>
                                <svg class="group-hover/product:rotate-180 group-hover/product:stroke-violet-900 lg:!stroke-white"
                                    fill="none" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                        d="M19 9l-7 7-7-7"></path>
                                </svg>
                            </button>
                            <!-- Dropdown -->
                            <div id="dropdownMenu2" class="dropdown-mainmenu hidden lg:group-hover/product:block">
{{ partial:partials/mega-nav }}
</div>
                        </div>

                        
                    </div>

                    <div class="lg:hidden flex">
                        <button id="menuToggle" class="lg:hidden text-gray-800">
                            <svg class="sm:w-5 sm:h-5 w-4 h-4" aria-hidden="true" xmlns="http://www.w3.org/2000/svg"
                                fill="none" viewBox="0 0 17 14">
                                <path stroke="white" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                    d="M1 1h15M1 7h15M1 13h15" />
                            </svg>
                        </button>
                    </div>
                </div>
            </div>
        </nav>
    </header>
