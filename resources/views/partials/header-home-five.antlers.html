<header class="z-50 relative bg-violet-400">
        <!-- UP-HEADER -->
        <div class="bg-violet-900">
            <p class="sm:text-base text-sm text-center text-white py-1">Browse the shop. Inquiries only. Nothing is charged.</p>
        </div>

        <!-- DOWN-HEADER -->
        <nav class="relative w-full z-50 lg:pt-3 pd:py-10 py-6" id="nav">
            <div class="2xl:container">
                <div class="mx-auto px-4 flex justify-between items-center">
                    <div class="site-logo">
                        <a href="/home-five">
                            <img decoding="async" loading="lazy" src="{{ partial:partials/media-url :file="setting:logo" fallback="image/main-logo.svg" }}" alt="company logo"
                                class="lg:w-[350px] pe-6" />
                        </a>
                    </div>

                    <!-- Links Section -->
                    <div id="navMenu"
                        class="overflow-auto lg:overflow-visible lg:h-16 h-full fixed inset-0 w-full bg-white z-50 flex flex-col items-center lg:justify-center lg:static lg:flex lg:flex-row space-y-0 2xl:space-x-10 1xl:space-x-8 space-x-6 lg:bg-transparent lg:divide-y-0 divide-y divide-lightborder-100">
                        <div
                            class="flex items-center justify-between w-full lg:hidden bg-violet-400 sm:py-6 py-3 px-6">
                            <a href="/home-five">
                                <img decoding="async" loading="lazy" src="{{ partial:partials/media-url :file="setting:logo" fallback="image/main-logo.svg" }}"
                                    alt="company logo" />
                            </a>
                            <button type="button" aria-label="Close menu" id="menuClose" class="self-end lg:hidden">
                                <svg class="w-6 h-6 text-gray-800" fill="none" stroke="currentColor"
                                    viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                        d="M6 18L18 6M6 6l12 12"></path>
                                </svg>
                            </button>
                        </div>

                        <!-- 1ST -->
                        <div class="group/product dropdown-toggle mx-0 lg:py-5 sm:py-7 py-4">
                            <button type="button" aria-expanded="false" id="dropdownToggle1"
                                class="lg:group-hover/product:border-violet-900 lg:group-focus/product:border-violet-900 lg:group-active/product:border-violet-900 !w-auto !mx-auto !h-auto lg:!pb-[22px] !p-0">
                                <p
                                    class="!text-black 1xl:!text-lg lg:!text-base sm:!text-lg !text-base group-hover/product:!text-violet-900 group-focus/product:!text-violet-900 group-active/product:!text-violet-900">
                                    Home
                                </p>
                                <svg class="group-hover/product:rotate-180 group-hover/product:!stroke-violet-900 !stroke-black"
                                    fill="none" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                        d="M19 9l-7 7-7-7"></path>
                                </svg>
                            </button>
                            <!-- Dropdown -->
                            <div id="dropdownMenu1"
                                class="dropdown-mainmenu hidden lg:group-hover/product:block lg:w-[190px] lg:left-auto lg:right-auto py-4 lg:bg-white lg:mt-12 sm:mt-6 mt-4">
                                <div class="lg:mb-0 mb-3">
                                    <h6 class="product-heading">Menu</h6>
                                    {{ partial:partials/page-nav }}
                                </div>
                            </div>
                        </div>

                        

                        <!-- 3RD -->
                        <div class="group/product dropdown-toggle lg:py-5 sm:py-7 py-4">
                            <button type="button" aria-expanded="false" id="dropdownToggle2"
                                class="lg:group-hover/product:border-violet-900 lg:group-focus/product:border-violet-900 lg:group-active/product:border-violet-900 !w-auto !mx-auto !h-auto lg:!pb-[22px] !p-0">
                                <p
                                    class="!text-black 1xl:!text-lg lg:!text-base sm:!text-lg !text-base group-hover/product:!text-violet-900 group-focus/product:!text-violet-900 group-active/product:!text-violet-900">
                                    New Arrivals
                                </p>
                                <svg class="group-hover/product:rotate-180 group-hover/product:!stroke-violet-900 !text-black"
                                    fill="none" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                        d="M19 9l-7 7-7-7"></path>
                                </svg>
                            </button>
                            <!-- Dropdown -->
                            <div id="dropdownMenu2"
                                class="dropdown-mainmenu hidden lg:group-hover/product:block py-8 lg:bg-white lg:mt-12">
{{ partial:partials/mega-nav }}
</div>
                        </div>

                        

                        

                        

                        
                    </div>

                    <div class="flex items-center gap-4" id="extra-options">
                        <div
                            class="border-r-2 lg:border-transparent border-gray-400/20 lg:p-0 sm:pr-6 pr-4 h-full ">
                            <!-- <start> -->
                            <ul class="flex items-center xl:gap-[20px] sm:gap-[15px] gap-2">
                                <li>
                                    <div class="flex items-center gap-4 xl:border-l border-lightborder-100/25"
                                        id="extra-options">
                                        <button id="openModalButton" class="bg-transparent text-white">
                                            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16"
                                                class="lg:w-[22px] lg:h-[22px] sm:w-[20px] sm:h-[20px] w-[18px] h-[18px] fill-black hover:fill-violet-900">
                                                <path fill-rule="evenodd"
                                                    d="M6.5 2a4.5 4.5 0 1 0 0 9a4.5 4.5 0 0 0 0-9M1 6.5a5.5 5.5 0 1 1 9.727 3.52l3.127 3.126l-.708.708l-3.126-3.127A5.5 5.5 0 0 1 1 6.5"
                                                    clip-rule="evenodd" />
                                            </svg>
                                        </button>
                                        <div id="modal" class="main-modal lg:absolute hidden lg:w-[71%]">
                                            <div class="modal">
                                                <!-- Close Button -->
                                                <button id="closeModalButton" class="closeModalButton2">✕</button>
                                                <form class="modal-form2" method="get" action="/shop">
                                                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16"
                                                        class="1xl:w-[22px] sm:w-[19px] w-[17px] fill-black hover:fill-violet-900 sm:me-3 me-1 my-auto">
                                                        <path fill-rule="evenodd"
                                                            d="M6.5 2a4.5 4.5 0 1 0 0 9a4.5 4.5 0 0 0 0-9M1 6.5a5.5 5.5 0 1 1 9.727 3.52l3.127 3.126l-.708.708l-3.126-3.127A5.5 5.5 0 0 1 1 6.5"
                                                            clip-rule="evenodd" />
                                                    </svg>
                                                    <label class="relative block w-full h-full">
                                                        <input placeholder="Search the shop" type="search" name="q" aria-label="Search the shop" class="placeholder:text-grey-400"
                                                            required />
                                                    </label>
                                                </form>
                                            </div>
                                        </div>
                                    </div>
                                </li>

                                <li>
                                    <a href="{{ if logged_in }}/account{{ else }}/login{{ /if }}">
                                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"
                                            class="1xl:w-[24px] 1xl:h-[24px] sm:w-[22px] sm:h-[22px] w-[20px] h-[20px] stroke-black hover:stroke-violet-900">
                                            <g fill="none" stroke-linecap="round" stroke-linejoin="round"
                                                stroke-width="1.5">
                                                <circle cx="12" cy="8" r="5" />
                                                <path d="M20 21a8 8 0 1 0-16 0m16 0a8 8 0 1 0-16 0" />
                                            </g>
                                        </svg>
                                    </a>
                                </li>

                                <li>

                                    <a href="/wishlist" class="relative">
                                        <svg xmlns="http://www.w3.org/2000/svg"
                                            class="1xl:w-[24px] 1xl:h-[24px] sm:w-[22px] sm:h-[22px] w-[20px] h-[20px] fill-black hover:fill-violet-900"
                                            viewBox="0 0 36 36">
                                            <path stroke="none"
                                                d="M18 32.43a1 1 0 0 1-.61-.21C11.83 27.9 8 24.18 5.32 20.51C1.9 15.82 1.12 11.49 3 7.64c1.34-2.75 5.19-5 9.69-3.69A9.87 9.87 0 0 1 18 7.72a9.87 9.87 0 0 1 5.31-3.77c4.49-1.29 8.35.94 9.69 3.69c1.88 3.85 1.1 8.18-2.32 12.87c-2.68 3.67-6.51 7.39-12.07 11.71a1 1 0 0 1-.61.21M10.13 5.58A5.9 5.9 0 0 0 4.8 8.51c-1.55 3.18-.85 6.72 2.14 10.81A57 57 0 0 0 18 30.16a57 57 0 0 0 11.06-10.83c3-4.1 3.69-7.64 2.14-10.81c-1-2-4-3.59-7.34-2.65a8 8 0 0 0-4.94 4.2a1 1 0 0 1-1.85 0a7.93 7.93 0 0 0-4.94-4.2a7.3 7.3 0 0 0-2-.29"
                                                class="clr-i-outline clr-i-outline-path-1" />
                                            <path fill="none" d="M0 0h36v36H0z" />
                                        </svg>
                                    </a>

                                </li>

                                <li>
                                    <div class="flex justify-center items-center">
                                        <div x-data="{ open: false }" class="flex justify-center items-center">
                                            <!-- Sidebar Overlay -->
                                            <div x-show="open" class="fixed inset-0 z-50 overflow-hidden">
                                                <div x-show="open"
                                                    x-transition:enter="transition-opacity ease-out duration-300"
                                                    x-transition:enter-start="opacity-0"
                                                    x-transition:enter-end="opacity-100"
                                                    x-transition:leave="transition-opacity ease-in duration-300"
                                                    x-transition:leave-start="opacity-100"
                                                    x-transition:leave-end="opacity-0"
                                                    class="absolute inset-0 bg-gray-500 bg-opacity-75 transition-opacity">
                                                </div>
                                                <!-- Sidebar Content -->
                                                <section class="absolute inset-y-0 right-0 pl-5 max-w-full flex">
                                                    <div x-show="open"
                                                        x-transition:enter="transition-transform ease-out duration-300"
                                                        x-transition:enter-start="transform translate-x-full"
                                                        x-transition:enter-end="transform translate-x-0"
                                                        x-transition:leave="transition-transform ease-in duration-300"
                                                        x-transition:leave-start="transform translate-x-0"
                                                        x-transition:leave-end="transform translate-x-full"
                                                        class="w-screen lg:max-w-sm sm:max-w-[21rem]">
                                                        <div
                                                            class="h-full flex flex-col bg-white shadow-xl md:px-[26px] sm:px-5 px-4 md:py-5 py-3">
                                                            <!-- Sidebar Header -->
                                                            <div class="flex items-center justify-between">
                                                                <h6 class="text-[20px] font-medium text-black">CART
                                                                </h6>
                                                                <button x-on:click="open = false"
                                                                    class="text-gray-500 hover:text-gray-700">
                                                                    <span class="sr-only">Close</span>
                                                                    <svg class="sm:h-6 sm:w-6 h-5 w-5 stroke-violet-900"
                                                                        x-description="Heroicon name: x"
                                                                        xmlns="http://www.w3.org/2000/svg"
                                                                        fill="none" viewBox="0 0 24 24"
                                                                        aria-hidden="true">
                                                                        <path stroke-linecap="round"
                                                                            stroke-linejoin="round" stroke-width="2"
                                                                            d="M6 18L18 6M6 6l12 12">
                                                                        </path>
                                                                    </svg>
                                                                </button>
                                                            </div>

                                                            <hr
                                                                class="w-full border border-lightborder-200 sm:mt-5 mt-2 1xl:mb-9 xl:mb-7 sm:mb-5 mb-2" />
                                                            <!-- Sidebar Content -->
<div class="mt-4">
    <p class="text-sm">This screen is a design example. Nothing is saved.</p>
    <p class="text-sm mt-3"><a class="border-b border-black" href="/contact">Send an inquiry</a></p>
</div>

                                                        </div>
                                                    </div>
                                                </section>
                                            </div>
                                            <!-- Open sidebar button -->
                                            <button x-on:click="open = true" class="relative text-white rounded-md">
                                                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"
                                                    class="1xl:w-[22px] 1xl:h-[22px] sm:w-[20px] sm:h-[20px] w-[18px] h-[18px] hover:stroke-violet-900 stroke-black">
                                                    <path stroke-width="1.5" fill="none"
                                                        d="M2 12h20l-2 11H4zm18-4l-6-7M4 8l6-7M1 8h22v4H1zm7 7v5m8-5v5m-4-5v5" />
                                                </svg>
                                            </button>
                                        </div>
                                    </div>
                                </li>
                            </ul>
                            <!-- <end> -->
                        </div>
                        <button id="menuToggle" class="lg:hidden text-gray-800">
                            <svg class="sm:w-5 sm:h-5 w-4 h-3" aria-hidden="true" xmlns="http://www.w3.org/2000/svg"
                                fill="none" viewBox="0 0 17 14">
                                <path stroke="black" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                    d="M1 1h15M1 7h15M1 13h15" />
                            </svg>
                        </button>
                    </div>
                </div>
            </div>
        </nav>
    </header>
