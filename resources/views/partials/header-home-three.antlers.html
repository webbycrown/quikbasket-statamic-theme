<header class="bg-transparent backdrop-blur-sm absolute w-full z-50" id="header">
        <!-- UP-HEADER -->
        <div
            class="bg-transparent relative xl:px-7 px-4 2xl:py-1.5 py-2 inline-block w-full border-b border-lightborder-100/25">
            <div class="flex justify-between items-center w-full">
                <div x-data="{ sidebarOpen: false, activeDropdown: null }"
                    class="flex sm:items-start items-center sm:gap-5 gap-3 relative">
                    <!-- Dropdown 1 -->
                    <div @click.away="open = false" x-data="{ open: false, activeIndex: 0, languages: [
                            { name: 'English', flag: '/assets/image/usa flage.webp' },
                            { name: 'Argentina', flag: '/assets/image/argentina.svg' },
                            { name: 'Brazil', flag: '/assets/image/brazil.svg' },
                            { name: 'Germany', flag: '/assets/image/germany.svg' },
                            { name: 'Spain', flag: '/assets/image/spain.svg' },
                            { name: 'France', flag: '/assets/image/france.svg' }
                        ]}" class="m-auto">
                        <!-- Dropdown Button -->
                        <button type="button" @click="open = !open" class="group click-dropdown">
                            <img decoding="async" loading="lazy" :src="languages[activeIndex].flag" alt="flag"
                                class="w-5 h-3 !mr-2" />
                            <p class="!text-sm button-name">
                                <span x-text="languages[activeIndex].name"></span>
                            </p>
                            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="3"
                                :class="{'rotate-180': open, 'rotate-0': !open}" stroke="white"
                                class="sm:size-3 size-2.5 duration-200 transform sm:ms-3 ms-2">
                                <path stroke-linecap="round" stroke-linejoin="round" d="m19.5 8.25-7.5 7.5-7.5-7.5" />
                            </svg>
                        </button>

                        <!-- Dropdown Menu -->
                        <div x-show="open" x-transition:enter="transition ease-out duration-200 transform"
                            x-transition:enter-start="opacity-0 scale-95 -translate-y-2"
                            x-transition:enter-end="opacity-100 scale-100 translate-y-0"
                            x-transition:leave="transition ease-in duration-150 transform"
                            x-transition:leave-start="opacity-100 scale-100 translate-y-0"
                            x-transition:leave-end="opacity-0 scale-95 -translate-y-2"
                            class="click-drodpwown-menu z-50 !w-36 !p-1 2xl:top-6 top-[1.8rem]">
                            <!-- Language Items -->
                            <template x-for="(language, index) in languages" :key="index">
                                <a href="#" @click.prevent="activeIndex = index; open = false" :class="{
                                        'bg-gray-400/50 text-gray-700': activeIndex === index, 
                                        'text-gray-700 hover:bg-gray-400 hover:text-white': activeIndex !== index
                                    }" class="group/text flex items-center">
                                    <img decoding="async" loading="lazy" :src="language.flag" alt="flags"
                                        class="me-1 w-[22px]" />
                                    <p :class="{'text-gray-700': activeIndex === index, 'text-gray-700 group-hover/text:text-white': activeIndex !== index}"
                                        class="text-sm">
                                        <span x-text="language.name"></span>
                                    </p>
                                </a>
                            </template>
                        </div>
                    </div>
                    <!-- Dropdown 2 -->
                    <div @click.away="open = false" x-data="{ open: false, activeIndex: 0, countries: [
                            { name: 'USD' },
                            { name: 'CAD' },
                            { name: 'ERN' },
                            { name: 'GMD' },
                            { name: 'INR' },
                            { name: 'MVR' }
                        ]}" class="m-auto relative">
                        <!-- Dropdown Button -->
                        <button type="button" @click="open = !open" class="group click-dropdown">
                            <p class="button-name !text-sm">
                                <span x-text="countries[activeIndex].name"></span>
                            </p>
                            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="3"
                                :class="{'rotate-180': open, 'rotate-0': !open}" stroke="white"
                                class="sm:size-3 size-2.5 duration-200 transform sm:ms-3 ms-2">
                                <path stroke-linecap="round" stroke-linejoin="round" d="m19.5 8.25-7.5 7.5-7.5-7.5" />
                            </svg>
                        </button>

                        <!-- Dropdown Menu -->
                        <div x-show="open" x-transition:enter="transition ease-out duration-200 transform"
                            x-transition:enter-start="opacity-0 scale-95 -translate-y-2"
                            x-transition:enter-end="opacity-100 scale-100 translate-y-0"
                            x-transition:leave="transition ease-in duration-150 transform"
                            x-transition:leave-start="opacity-100 scale-100 translate-y-0"
                            x-transition:leave-end="opacity-0 scale-95 -translate-y-2"
                            class="click-drodpwown-menu !w-20 !space-y-0 2xl:top-6 top-[1.8rem]">
                            <!-- Language Items -->
                            <template x-for="(country, index) in countries" :key="index">
                                <a href="#" @click.prevent="activeIndex = index; open = false" :class="{
                                    ' text-violet-900': activeIndex === index,
                                        'text-gray-700 hover:text-violet-900': activeIndex !== index
                                    }" class="group/text justify-between">
                                    <p :class="{'text-violet-900': activeIndex === index, 'text-gray-700 group-hover/text:text-violet-900': activeIndex !== index}"
                                        class="text-sm text-start px-1">
                                        <span x-text="country.name"></span>
                                    </p>
                                    <span
                                        :class="{'opacity-100': activeIndex === index, 'opacity-0': activeIndex !== index}"
                                        aria-hidden="true" class="text-inherit w-3 h-3 flex-shrink-0"><svg
                                            aria-hidden="true" data-selected="true" role="presentation"
                                            viewBox="0 0 17 18">
                                            <polyline fill="none" points="1 9 7 14 15 4" stroke="currentColor"
                                                stroke-dasharray="22" stroke-dashoffset="44" stroke-linecap="round"
                                                stroke-linejoin="round" stroke-width="1.5"
                                                style="transition: stroke-dashoffset 200ms;"></polyline>
                                        </svg></span> </template>
                        </div>
                    </div>
                </div>
                <div class="flex justify-between items-center xl:gap-[22px] lg:gap-[20px] gap-[17px]">
                    <a href="/wishlist" class="flex items-center justify-center gap-2 hover:scale-110">
                        <img decoding="async" loading="lazy" src="/assets/image/heart.svg" alt="Wishlist" class="w-[17px]" />
                    </a>
                    <a href="/cart" class="flex items-center justify-center gap-2 hover:scale-110">
                        <img decoding="async" loading="lazy" src="/assets/image/basket.svg" alt="Cart" class="w-[17px]" />
                    </a>
                    <a href="{{ if logged_in }}/account{{ else }}/login{{ /if }}" class="flex items-center justify-center gap-2 hover:scale-110">
                        <img decoding="async" loading="lazy" src="/assets/image/login.svg" alt="Login" class="w-[17px]" />
                        <p class="text-sm font-normal text-white lg:block hidden">Login</p>
                    </a>
                </div>

            </div>
        </div>

        <!-- DOWN-HEADER -->
        <nav id="nav" class="relative w-full z-40 border-b border-lightborder-100/25">
            <div class="1xl:px-[26px] px-[20px] mx-auto flex justify-between items-stretch">
                <button id="menuToggle" aria-label="Close" class="xl:hidden text-gray-800 p-4 ps-0">
                    <svg class="sm:w-5 sm:h-5 w-4 h-3" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none"
                        viewBox="0 0 17 14">
                        <path stroke="white" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M1 1h15M1 7h15M1 13h15" />
                    </svg>
                </button>
                <div
                    class="site-logo xl:border-r border-lightborder-100/25 h-auto 1xl:w-[14%] xl:w-[16%] sm:w-[200px] w-[157px] 1xl:pe-[26px] xl:pe-4 justify-center flex items-center">
                    <a href="/home-three">
                        <img decoding="async" loading="lazy" src="/assets/image/main-white-logo.webp" alt="main-logo"
                            class="w-full h-full" />
                    </a>
                </div>

                <!-- Links Section -->
                <div id="navMenu"
                    class="xl:w-[81%] 2xl:space-x-10 1xl:space-x-6 xl:space-x-4 xl:flex xl:flex-row xl:justify-center xl:items-center fixed inset-0
                 bg-white z-40 animate-slide flex-col items-center xl:static xl:bg-transparent xl:p-0 xl:divide-y-0 divide-y divide-lightborder-100 xl:m-0">
                    <div class="flex items-center justify-between w-full xl:hidden bg-violet-400 p-4">
                        <div class="site-logo xl:hidden block">
                            <a href="/">
                                <img decoding="async" loading="lazy" src="{{ partial:partials/media-url :file="setting:logo" fallback="image/main-logo.svg" }}" alt="main-logo"
                                    title="main-logo"
                                    class="1xl:w-[229px] xl:w-[215px] sm:w-[185px] w-[135px] m-auto" />
                            </a>
                        </div>
                        <button type="button" aria-label="Close menu" id="menuClose" class="self-end xl:hidden">
                            <svg class="w-6 h-6 text-gray-800" fill="none" stroke="currentColor" viewBox="0 0 24 24"
                                xmlns="http://www.w3.org/2000/svg">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                    d="M6 18L18 6M6 6l12 12"></path>
                            </svg>
                        </button>
                    </div>

                    <!-- 1ST -->
                    <div class="group/product dropdown-toggle2 !m-0">
                        <button type="button" aria-expanded="false" id="dropdownToggle1"
                            class="lg:group-hover/product:border-violet-900 lg:group-focus/product:border-violet-900 lg:group-active/product:border-violet-900">
                            <p
                                class="group-hover/product:text-violet-900 group-focus/product:text-violet-900 group-active/product:text-violet-900 xl:!text-white text-black">
                                Pages
                            </p>
                            <svg class="group-hover/product:rotate-180 group-hover/product:stroke-violet-900 xl:!stroke-white"
                                fill="none" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                    d="M19 9l-7 7-7-7"></path>
                            </svg>
                        </button>
                        <!-- Dropdown -->
                        <div id="dropdownMenu1"
                            class="xl:w-[190px] xl:left-auto xl:right-auto relative hidden -mt-1 xl:group-hover/product:block xl:absolute xl:mt-0 xl:top-full
                            animate-dropdown left-0 right-0 w-full shadow-xl z-40 xl:border-t border-lightborder-200 dropdown-mainmenu">
                            <div>
                                <h6 class="product-heading">Home
                                    Pages</h6>
                                {{ partial:partials/page-nav }}
                            </div>
                        </div>
                    </div>

                    <!-- 2ND -->
                    <div class="group/product dropdown-toggle2">
                        <button type="button" aria-expanded="false" id="dropdownToggle2"
                            class="xl:group-hover/product:border-violet-900 xl:group-focus/product:border-violet-900 xl:group-active/product:border-violet-900">
                            <p
                                class="group-hover/product:text-violet-900 group-focus/product:text-violet-900 group-active/product:text-violet-900 xl:!text-white text-black">
                                New Arrivals
                            </p>
                            <svg class="group-hover/product:rotate-180 group-hover/product:stroke-violet-900 xl:!stroke-white"
                                fill="none" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                    d="M19 9l-7 7-7-7"></path>
                            </svg>
                        </button>
                        <!-- Dropdown -->
                        <div id="dropdownMenu2"
                            class="relative hidden -mt-1 xl:group-hover/product:block xl:absolute xl:mt-0 xl:left-0 xl:top-full
                            animate-dropdown left-0 right-0 w-full shadow-xl z-40 xl:border-t border-lightborder-200 dropdown-mainmenu">
{{ partial:partials/mega-nav }}
</div>
                    </div>

                    
                </div>

                <div class="flex items-center gap-4 xl:border-l border-lightborder-100/25 w-[5%] ps-4 justify-center h-auto"
                    id="extra-options">
                    <button id="openModalButton" class="bg-transparent text-white">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16"
                            class="lg:w-[22px] lg:h-[22px] sm:w-[20px] sm:h-[20px] w-[18px] fill-white hover:fill-violet-900 m-auto">
                            <path fill-rule="evenodd"
                                d="M6.5 2a4.5 4.5 0 1 0 0 9a4.5 4.5 0 0 0 0-9M1 6.5a5.5 5.5 0 1 1 9.727 3.52l3.127 3.126l-.708.708l-3.126-3.127A5.5 5.5 0 0 1 1 6.5"
                                clip-rule="evenodd" />
                        </svg>
                    </button>
                    <div id="modal" class="main-modal3 hidden">
                        <div class="modal">
                            <!-- Close Button -->
                            <button id="closeModalButton" class="closeModalButton">✕</button>
                            <form class="modal-form" method="get" action="/shop">
                                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16"
                                    class="1xl:w-[22px] sm:w-[19px] w-[17px] fill-black hover:fill-violet-900 sm:me-3 me-1 my-auto">
                                    <path fill-rule="evenodd"
                                        d="M6.5 2a4.5 4.5 0 1 0 0 9a4.5 4.5 0 0 0 0-9M1 6.5a5.5 5.5 0 1 1 9.727 3.52l3.127 3.126l-.708.708l-3.126-3.127A5.5 5.5 0 0 1 1 6.5"
                                        clip-rule="evenodd" />
                                </svg>
                                <label class="relative block w-full h-full">
                                    <input placeholder="Search the shop" type="search" name="q" aria-label="Search the shop"
                                        class="placeholder:text-grey-400" required />
                                </label>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </nav>
    </header>
