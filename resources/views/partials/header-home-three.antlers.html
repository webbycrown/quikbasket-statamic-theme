<header class="bg-transparent backdrop-blur-sm absolute w-full z-50" id="header">
        <!-- UP-HEADER -->
        <div
            class="bg-transparent relative xl:px-7 px-4 2xl:py-1.5 py-2 inline-block w-full border-b border-lightborder-100/25">
            <div class="flex justify-end items-center w-full">
                <div class="flex justify-between items-center xl:gap-[22px] lg:gap-[20px] gap-[17px]">
                    <a href="/wishlist" class="flex items-center justify-center gap-2 hover:scale-110">
                        <img decoding="async" loading="lazy" src="/assets/image/heart.svg" alt="Wishlist" class="w-[17px]" />
                    </a>
                    <a href="/cart" class="flex items-center justify-center gap-2 hover:scale-110">
                        <img decoding="async" loading="lazy" src="/assets/image/basket.svg" alt="Cart" class="w-[17px]" />
                    </a>
                    <a href="{{ if logged_in }}/account{{ else }}/login{{ /if }}" class="flex items-center justify-center gap-2 hover:scale-110">
                        <img decoding="async" loading="lazy" src="/assets/image/login.svg" alt="Login" class="w-[17px]" />
                        <p class="text-sm font-normal text-white lg:block hidden">Login</p>
                    </a>
                </div>
            </div>
        </div>

        <!-- DOWN-HEADER -->
        <nav id="nav" class="relative w-full z-40 border-b border-lightborder-100/25">
            <div class="1xl:px-[26px] px-[20px] mx-auto flex justify-between items-stretch">
                <button id="menuToggle" aria-label="Close" class="xl:hidden text-gray-800 p-4 ps-0">
                    <svg class="sm:w-5 sm:h-5 w-4 h-3" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none"
                        viewBox="0 0 17 14">
                        <path stroke="white" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M1 1h15M1 7h15M1 13h15" />
                    </svg>
                </button>
                <div
                    class="site-logo xl:border-r border-lightborder-100/25 h-auto 1xl:w-[14%] xl:w-[16%] sm:w-[200px] w-[157px] 1xl:pe-[26px] xl:pe-4 justify-center flex items-center">
                    <a href="{{ partial:partials/page-href id='home-three' }}">
                        <img decoding="async" loading="lazy" src="{{ partial:partials/media-url :file="setting:logo_white" fallback="image/main-white-logo.svg" }}" alt="{{ setting:site_name }}"
                            class="w-full h-full" />
                    </a>
                </div>

                <!-- Links Section -->
                <div id="navMenu"
                    class="xl:w-[81%] 2xl:space-x-10 1xl:space-x-6 xl:space-x-4 xl:flex xl:flex-row xl:justify-center xl:items-center fixed inset-0
                 bg-white z-40 animate-slide flex-col items-center xl:static xl:bg-transparent xl:p-0 xl:divide-y-0 divide-y divide-lightborder-100 xl:m-0">
                    <div class="flex items-center justify-between w-full xl:hidden bg-violet-400 p-4">
                        <div class="site-logo xl:hidden block">
                            <a href="/">
                                <img decoding="async" loading="lazy" src="{{ partial:partials/media-url :file="setting:logo" fallback="image/main-logo.svg" }}" alt="{{ setting:site_name }}"
                                    title="main-logo"
                                    class="1xl:w-[229px] xl:w-[215px] sm:w-[185px] w-[160px] h-10 sm:h-11 m-auto object-contain" />
                            </a>
                        </div>
                        <button type="button" aria-label="Close menu" id="menuClose" class="self-end xl:hidden">
                            <svg class="w-6 h-6 text-gray-800" fill="none" stroke="currentColor" viewBox="0 0 24 24"
                                xmlns="http://www.w3.org/2000/svg">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                    d="M6 18L18 6M6 6l12 12"></path>
                            </svg>
                        </button>
                    </div>

                    {{ partial:partials/shop-nav variant="home3" }}

                    
                </div>

                <div class="flex items-center gap-4 xl:border-l border-lightborder-100/25 w-[5%] ps-4 justify-center h-auto"
                    id="extra-options">
                    <button id="openModalButton" class="bg-transparent text-white">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16"
                            class="lg:w-[22px] lg:h-[22px] sm:w-[20px] sm:h-[20px] w-[18px] fill-white hover:fill-violet-900 m-auto">
                            <path fill-rule="evenodd"
                                d="M6.5 2a4.5 4.5 0 1 0 0 9a4.5 4.5 0 0 0 0-9M1 6.5a5.5 5.5 0 1 1 9.727 3.52l3.127 3.126l-.708.708l-3.126-3.127A5.5 5.5 0 0 1 1 6.5"
                                clip-rule="evenodd" />
                        </svg>
                    </button>
                    <div id="modal" class="main-modal3 hidden">
                        <div class="modal">
                            <!-- Close Button -->
                            <button id="closeModalButton" class="closeModalButton">✕</button>
                            <form class="modal-form" method="get" action="/shop">
                                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16"
                                    class="1xl:w-[22px] sm:w-[19px] w-[17px] fill-black hover:fill-violet-900 sm:me-3 me-1 my-auto">
                                    <path fill-rule="evenodd"
                                        d="M6.5 2a4.5 4.5 0 1 0 0 9a4.5 4.5 0 0 0 0-9M1 6.5a5.5 5.5 0 1 1 9.727 3.52l3.127 3.126l-.708.708l-3.126-3.127A5.5 5.5 0 0 1 1 6.5"
                                        clip-rule="evenodd" />
                                </svg>
                                <label class="relative block w-full h-full">
                                    <input placeholder="Search the shop" type="search" name="q" aria-label="Search the shop"
                                        class="placeholder:text-grey-400" required />
                                </label>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </nav>
    </header>
