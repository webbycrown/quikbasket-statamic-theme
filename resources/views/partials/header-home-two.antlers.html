<header x-data="{ sidebarOpen: false, activeDropdown: null }"
        class="absolute bg-transparent z-40 w-full lg:py-9 sm:py-6 py-5 border-b border-white/15" id="nav">
        <div class="px-4">
            <!-- Full-width Sidebar -->
            <aside :class="sidebarOpen ? 'translate-x-0' : '-translate-x-full'"
                class="fixed inset-0 bg-white text-gray-100 transform transition-transform duration-500 ease-in-out flex">
                <!-- Left section with dropdowns and close button -->
                <div class="lg:w-2/3 w-full overflow-auto nav-scrollbar">
                    <div
                        class="flex justify-between items-center bg-violet-400 xl:py-6 xl:px-8 md:py-4 md:px-6 py-2 px-4">
                        <a href="{{ partial:partials/page-href id='home-two' }}" class="1xl:w-[19%] sm:w-auto w-3/5">
                            <img decoding="async" loading="lazy" src="{{ partial:partials/media-url :file="setting:logo" fallback="image/main-logo.svg" }}" alt="Company Logo">
                        </a>
                        <button type="button" @click="sidebarOpen = false" name="close" class="wc-close-btn text-900 text-[22px] py-3"
                            aria-label="Close">
                            <svg width="26" height="26" viewBox="0 0 24 24" fill="none"
                                xmlns="http://www.w3.org/2000/svg" class="fill-none stroke stroke-[1.5px] stroke-black">
                                <path d="M18 6L6 18"></path>
                                <path d="M6 6L18 18"></path>
                            </svg>
                        </button>
                    </div>
                    <nav>
                        {{ partial:partials/shop-nav variant="sidebar" }}

                        
                    </nav>
                </div>

                <!-- Right section with image -->
                <div class="w-1/3 bg-gray-700 hidden lg:flex items-center justify-center ">
                    <img decoding="async" loading="lazy" src="/assets/image/header-img.webp" alt="Sidebar Image"
                        class="w-full h-full">
                </div>
            </aside>

            <!-- side menubar open button with logo and options -->
            <div class="flex justify-between items-center w-full 2xl:container">
                <main class="flex">
                    <button type="button" @click="sidebarOpen = true" name="mobile-menu-view" aria-label="Close"
                        class="mobile-menu-view 1xl:w-[50px] sm:w-[40px] w-[35px] block px-2 space-y-1.5">
                        <span class="w-full bg-white h-[2px] block"></span>
                        <span class="w-full bg-white h-[2px] block"></span>
                        <span class="w-full bg-white h-[2px] block"></span>
                    </button>
                </main>
                <div class="white-logo lg:ms-56 md:ms-32 sm:ms-28 ms-10">
                    <a href="{{ partial:partials/page-href id='home-two' }}"><img decoding="async" loading="lazy" src="{{ partial:partials/media-url :file="setting:logo_white" fallback="image/main-white-logo.webp" }}"
                            alt="{{ setting:site_name }}" class="xl:w-full lg:w-[88%] sm:w-[80%] w-3/4"></a>
                </div>
                <div class="flex justify-between items-center xl:gap-[22px] lg:gap-[20px] sm:gap-[17px]">
                    <!-- modal -->
                    <div class="flex items-center gap-4 " id="extra-options">
                        <button id="openModalButton"
                            class="bg-transparent text-white flex items-center gap-2 hover:scale-110">
                            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" class="w-[20px]">
                                <path fill="currentColor"
                                    d="m229.66 218.34l-50.07-50.06a88.11 88.11 0 1 0-11.31 11.31l50.06 50.07a8 8 0 0 0 11.32-11.32M40 112a72 72 0 1 1 72 72a72.08 72.08 0 0 1-72-72" />
                            </svg>
                            <p class="text-base font-normal text-white lg:block hidden">Search</p>
                        </button>
                        <div id="modal" class="main-modal2 hidden">
                            <div class="modal">
                                <!-- Close Button -->
                                <button id="closeModalButton" class="closeModalButton">✕</button>
                                <form class="modal-form" method="get" action="/shop">
                                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16"
                                        class="1xl:w-[22px] sm:w-[19px] w-[17px] fill-black hover:fill-violet-900 sm:me-3 me-1 my-auto">
                                        <path fill-rule="evenodd"
                                            d="M6.5 2a4.5 4.5 0 1 0 0 9a4.5 4.5 0 0 0 0-9M1 6.5a5.5 5.5 0 1 1 9.727 3.52l3.127 3.126l-.708.708l-3.126-3.127A5.5 5.5 0 0 1 1 6.5"
                                            clip-rule="evenodd" />
                                    </svg>
                                    <label class="relative block w-full h-full">
                                        <input placeholder="Search the shop" type="search" name="q" aria-label="Search the shop"
                                            class="placeholder:text-grey-400" required />
                                    </label>
                                </form>
                            </div>
                        </div>

                    </div>

                    <a href="/wishlist" class="flex items-center justify-center gap-2 hover:scale-110">
                        <img decoding="async" loading="lazy" src="/assets/image/heart.svg" alt="Wishlist"
                            class="sm:block hidden">
                    </a>
                    <a href="/cart" class="flex items-center justify-center gap-2 hover:scale-110">
                        <img decoding="async" loading="lazy" src="/assets/image/basket.svg" alt="Cart"
                            class="sm:block hidden">
                    </a>
                    <a href="{{ if logged_in }}/account{{ else }}/login{{ /if }}" class="flex items-center justify-center gap-2 hover:scale-110">
                        <img decoding="async" loading="lazy" src="/assets/image/login.svg" alt="Login"
                            class="sm:block hidden">
                        <p class="text-base font-normal text-white lg:block hidden">Login</p>
                    </a>
                </div>
            </div>
        </div>
    </header>
