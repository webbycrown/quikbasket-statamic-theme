{{ setting:footer_photos }}
<div class="relative w-full xl:h-full lg:h-[150px] md:h-[90px] h-24">
    <img decoding="async" loading="lazy" class="absolute-img delay-0" src="{{ url }}" alt="" />
    <a href="{{ setting:instagram_url }}" class="opacity-0 hover:opacity-100 absolute w-full h-full flex items-center justify-center text-white bg-violet-900/30 top-0 left-0 transition ease-in-out duration-200" aria-label="{{ setting:instagram_heading }}">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" aria-hidden="true">
            <g fill="none" stroke="white" stroke-width="1.5">
                <path stroke-linecap="round" stroke-linejoin="round" d="M12 16a4 4 0 1 0 0-8a4 4 0 0 0 0 8" />
                <path d="M3 16V8a5 5 0 0 1 5-5h8a5 5 0 0 1 5 5v8a5 5 0 0 1-5 5H8a5 5 0 0 1-5-5Z" />
                <path stroke-linecap="round" stroke-linejoin="round" d="m17.5 6.51l.01-.011" />
            </g>
        </svg>
    </a>
</div>
{{ /setting:footer_photos }}
