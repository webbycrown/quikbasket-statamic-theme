<header class="relative divide-y divide-lightborder-100 bg-white z-40">
        <!-- UP-HEADER -->
        <div class="container">
            <div class="flex items-center justify-between 2xl:py-2 py-1.5">
                <a href="{{ setting:instagram_url }}" class="flex items-center sm:gap-[7px] gap-[5px] group">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"
                        class="sm:w-[18px] sm:h-[18px] w-[17px] h-[17px] fill-black group-hover:fill-violet-900">
                        <rect width="24" height="24" fill="none" />
                        <path
                            d="M17.34 5.46a1.2 1.2 0 1 0 1.2 1.2a1.2 1.2 0 0 0-1.2-1.2m4.6 2.42a7.6 7.6 0 0 0-.46-2.43a4.9 4.9 0 0 0-1.16-1.77a4.7 4.7 0 0 0-1.77-1.15a7.3 7.3 0 0 0-2.43-.47C15.06 2 14.72 2 12 2s-3.06 0-4.12.06a7.3 7.3 0 0 0-2.43.47a4.8 4.8 0 0 0-1.77 1.15a4.7 4.7 0 0 0-1.15 1.77a7.3 7.3 0 0 0-.47 2.43C2 8.94 2 9.28 2 12s0 3.06.06 4.12a7.3 7.3 0 0 0 .47 2.43a4.7 4.7 0 0 0 1.15 1.77a4.8 4.8 0 0 0 1.77 1.15a7.3 7.3 0 0 0 2.43.47C8.94 22 9.28 22 12 22s3.06 0 4.12-.06a7.3 7.3 0 0 0 2.43-.47a4.7 4.7 0 0 0 1.77-1.15a4.85 4.85 0 0 0 1.16-1.77a7.6 7.6 0 0 0 .46-2.43c0-1.06.06-1.4.06-4.12s0-3.06-.06-4.12M20.14 16a5.6 5.6 0 0 1-.34 1.86a3.06 3.06 0 0 1-.75 1.15a3.2 3.2 0 0 1-1.15.75a5.6 5.6 0 0 1-1.86.34c-1 .05-1.37.06-4 .06s-3 0-4-.06a5.7 5.7 0 0 1-1.94-.3a3.3 3.3 0 0 1-1.1-.75a3 3 0 0 1-.74-1.15a5.5 5.5 0 0 1-.4-1.9c0-1-.06-1.37-.06-4s0-3 .06-4a5.5 5.5 0 0 1 .35-1.9A3 3 0 0 1 5 5a3.1 3.1 0 0 1 1.1-.8A5.7 5.7 0 0 1 8 3.86c1 0 1.37-.06 4-.06s3 0 4 .06a5.6 5.6 0 0 1 1.86.34a3.06 3.06 0 0 1 1.19.8a3.1 3.1 0 0 1 .75 1.1a5.6 5.6 0 0 1 .34 1.9c.05 1 .06 1.37.06 4s-.01 3-.06 4M12 6.87A5.13 5.13 0 1 0 17.14 12A5.12 5.12 0 0 0 12 6.87m0 8.46A3.33 3.33 0 1 1 15.33 12A3.33 3.33 0 0 1 12 15.33" />
                    </svg>
                    <p class="text-sm text-black group-hover:text-violet-900 transition-all">399k Followers</p>
                </a>
                <p class="text-sm lg:block hidden text-black">Inquiries only. Nothing is charged. |
                    <a href="{{ partial:partials/shop-href }}"
                        class="underline underline-offset-4 hover:text-violet-900 hover:decoration-violet-900">Click and
                        Shop Now.</a>
                </p>
                <ul class="flex items-center relative 1xl:pl-4 pl-3 sm:gap-4 gap-[14px]">
                    <li class="flex relative m-auto  lg:!border-0">
                        <div @click.away="open = false" x-data="{ open: false, activeIndex: 0, languages: [
                        { name: 'English', flag: '/assets/image/usa flage.webp' },
                        { name: 'Argentina', flag: '/assets/image/argentina.svg' },
                        { name: 'Brazil', flag: '/assets/image/brazil.svg' },
                        { name: 'Germany', flag: '/assets/image/germany.svg' },
                        { name: 'Spain', flag: '/assets/image/spain.svg' },
                        { name: 'France', flag: '/assets/image/france.svg' }
                    ]}" class="lg:m-auto ml-auto">
                            <!-- Dropdown Button -->
                            <button type="button" @click="open = !open" class="group click-dropdown">
                                <img decoding="async" loading="lazy" src="/assets/image/usa flage.webp" alt="flag" />
                                <p class="button-name text-[#282828] text-sm font-normal">
                                    <span x-text="languages[activeIndex].name"></span>
                                </p>
                                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="3"
                                    :class="{'rotate-180': open, 'rotate-0': !open}" stroke="#282828"
                                    class="sm:size-3 size-2.5 duration-200 transform sm:ms-2 ms-1">
                                    <path stroke-linecap="round" stroke-linejoin="round"
                                        d="m19.5 8.25-7.5 7.5-7.5-7.5" />
                                </svg>
                            </button>

                            <!-- Dropdown Menu -->
                            <div x-show="open" x-transition:enter="transition ease-out duration-200 transform"
                                x-transition:enter-start="opacity-0 scale-95 -translate-y-2"
                                x-transition:enter-end="opacity-100 scale-100 translate-y-0"
                                x-transition:leave="transition ease-in duration-150 transform"
                                x-transition:leave-start="opacity-100 scale-100 translate-y-0"
                                x-transition:leave-end="opacity-0 scale-95 -translate-y-2"
                                class="right-0 click-drodpwown-menu w-[150%] left-auto z-50">
                                <!-- Language Items -->
                                <template x-for="(language, index) in languages" :key="index">
                                    <a href="#" @click.prevent="activeIndex = index; open = false" :class="{
                                    'bg-gray-400 text-white': activeIndex === index, 
                                    'text-gray-700 hover:bg-gray-400 hover:text-white': activeIndex !== index
                                            }" class="group/text">
                                        <img decoding="async" loading="lazy" :src="language.flag" alt="flag"
                                            class="me-1.5 1xl:w-[20px] w-4" />
                                        <p :class="{'text-white': activeIndex === index, 'text-gray-700 group-hover/text:text-white': activeIndex !== index}"
                                            class="text-sm tracking-wide">
                                            <span x-text="language.name"></span>
                                        </p>
                                    </a>
                                </template>
                            </div>
                        </div>
                    </li>

                    <li @click.away="open = false" x-data="{ open: false, activeIndex: 0, countries: [
                    { name: 'USD' },
                    { name: 'CAD' },
                    { name: 'ERN' },
                    { name: 'GMD' },
                    { name: 'INR' },
                    { name: 'MVR' }
                            ]}" class="lg:m-auto ml-0 relative">
                        <!-- Dropdown Button -->
                        <button type="button" @click="open = !open" class="group click-dropdown">
                            <p class="button-name !text-sm text-[#282828] font-normal">
                                <span x-text="countries[activeIndex].name"></span>
                            </p>
                            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="3"
                                :class="{'rotate-180': open, 'rotate-0': !open}" stroke="#282828"
                                class="sm:size-3 size-2.5 duration-200 transform sm:ms-3 ms-1">
                                <path stroke-linecap="round" stroke-linejoin="round" d="m19.5 8.25-7.5 7.5-7.5-7.5" />
                            </svg>
                        </button>

                        <!-- Dropdown Menu -->
                        <div x-show="open" x-transition:enter="transition ease-out duration-200 transform"
                            x-transition:enter-start="opacity-0 scale-95 -translate-y-2"
                            x-transition:enter-end="opacity-100 scale-100 translate-y-0"
                            x-transition:leave="transition ease-in duration-150 transform"
                            x-transition:leave-start="opacity-100 scale-100 translate-y-0"
                            x-transition:leave-end="opacity-0 scale-95 -translate-y-2"
                            class="click-drodpwown-menu !w-20 top-[1.8rem] right-0 left-auto z-50 tracking-wide">
                            <!-- Language Items -->
                            <template x-for="(country, index) in countries" :key="index">
                                <a href="#" @click.prevent="activeIndex = index; open = false" :class="{
                            ' text-violet-900': activeIndex === index,
                                'text-gray-700 hover:text-violet-900': activeIndex !== index
                            }" class="group/text justify-between">
                                    <p :class="{'text-violet-900': activeIndex === index, 'text-gray-700 group-hover/text:text-violet-900': activeIndex !== index}"
                                        class="sm:text-sm text-[13px] text-start px-1">
                                        <span x-text="country.name"></span>
                                    </p>
                                    <span
                                        :class="{'opacity-100': activeIndex === index, 'opacity-0': activeIndex !== index}"
                                        aria-hidden="true" class="text-inherit w-3 h-3 flex-shrink-0">
                                        <svg aria-hidden="true" data-selected="true" role="presentation"
                                            class="w-[18px] h-[18px] fill-black group-hover:fill-violet-900"
                                            viewBox="0 0 17 18">
                                            <polyline fill="none" points="1 9 7 14 15 4" stroke="currentColor"
                                                stroke-dasharray="22" stroke-dashoffset="44" stroke-linecap="round"
                                                stroke-linejoin="round" stroke-width="1.5"
                                                style="transition: stroke-dashoffset 200ms;">
                                            </polyline>
                                        </svg>
                                    </span>
                            </template>
                        </div>
                    </li>
                </ul>
            </div>
        </div>

        <!-- DOWN-HEADER -->
        <nav class="lg:relative w-full z-40" id="nav">
            <div class="container mx-auto px-4 flex justify-between items-center relative lg:h-full h-20">
                <div class="site-logo">
                    <a href="{{ partial:partials/page-href id='home-five' }}">
                        <img decoding="async" loading="lazy" src="{{ partial:partials/media-url :file="setting:logo" fallback="image/main-logo.svg" }}" alt="company logo"
                            class="lg:w-[350px] sm:w-11/12 w-full pe-6" />
                    </a>
                </div>

                <!-- Links Section -->
                <div id="navMenu"
                    class="overflow-auto lg:overflow-visible lg:h-20 h-full fixed inset-0 w-full bg-white z-50 flex flex-col items-center lg:justify-center lg:static 
                    lg:flex lg:flex-row space-y-0 2xl:space-x-10 1xl:space-x-8 lg:space-x-[1.3rem] lg:bg-transparent lg:divide-y-0 divide-y divide-lightborder-100">
                    <div class="flex items-center justify-between w-full lg:hidden bg-violet-400 sm:py-6 py-5 px-6">
                        <a href="{{ partial:partials/page-href id='home-five' }}">
                            <img decoding="async" loading="lazy" src="{{ partial:partials/media-url :file="setting:logo" fallback="image/main-logo.svg" }}" alt="company logo"
                                class="w-11/12" />
                        </a>
                        <button type="button" aria-label="Close menu" id="menuClose" class="self-end lg:hidden">
                            <svg class="w-6 h-6 text-gray-800" fill="none" stroke="currentColor" viewBox="0 0 24 24"
                                xmlns="http://www.w3.org/2000/svg">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                    d="M6 18L18 6M6 6l12 12"></path>
                            </svg>
                        </button>
                    </div>

                    {{ partial:partials/shop-nav variant="row6" }}

                    

                    

                    

                    
                </div>

                <div class="flex items-center gap-4" id="extra-options">
                    <div class="border-r-2 lg:border-transparent border-gray-400/20 lg:p-0 sm:pr-6 pr-4 h-full">
                        <!-- <start> -->
                        <ul class="flex items-center xl:gap-[20px] gap-2.5">
                            <li>
                                <div class="flex items-center gap-4 xl:border-l border-lightborder-100/25"
                                    id="extra-options">
                                    <button id="openModalButton" class="bg-transparent text-white">
                                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16"
                                            class="lg:w-[22px] lg:h-[22px] sm:w-[20px] sm:h-[20px] w-[18px] h-[18px] fill-black hover:fill-violet-900">
                                            <path fill-rule="evenodd"
                                                d="M6.5 2a4.5 4.5 0 1 0 0 9a4.5 4.5 0 0 0 0-9M1 6.5a5.5 5.5 0 1 1 9.727 3.52l3.127 3.126l-.708.708l-3.126-3.127A5.5 5.5 0 0 1 1 6.5"
                                                clip-rule="evenodd" />
                                        </svg>
                                    </button>
                                    <div id="modal" class="main-modal hidden">
                                        <div class="modal">
                                            <!-- Close Button -->
                                            <button id="closeModalButton" class="closeModalButton">✕</button>
                                            <form class="modal-form" method="get" action="/shop">
                                                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16"
                                                    class="1xl:w-[22px] sm:w-[19px] w-[17px] fill-black hover:fill-violet-900 sm:me-3 me-1 my-auto">
                                                    <path fill-rule="evenodd"
                                                        d="M6.5 2a4.5 4.5 0 1 0 0 9a4.5 4.5 0 0 0 0-9M1 6.5a5.5 5.5 0 1 1 9.727 3.52l3.127 3.126l-.708.708l-3.126-3.127A5.5 5.5 0 0 1 1 6.5"
                                                        clip-rule="evenodd" />
                                                </svg>
                                                <label class="relative block w-full h-full">
                                                    <input placeholder="Search the shop" type="search" name="q" aria-label="Search the shop"
                                                        class="placeholder:text-grey-400" />
                                                </label>
                                            </form>
                                        </div>
                                    </div>
                                </div>
                            </li>

                            <li>
                                <a href="{{ if logged_in }}/account{{ else }}/login{{ /if }}">
                                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"
                                        class="1xl:w-[24px] 1xl:h-[24px] sm:w-[22px] sm:h-[22px] w-[20px] h-[20px] stroke-black hover:stroke-violet-900">
                                        <g fill="none" stroke-linecap="round" stroke-linejoin="round"
                                            stroke-width="1.5">
                                            <circle cx="12" cy="8" r="5" />
                                            <path d="M20 21a8 8 0 1 0-16 0m16 0a8 8 0 1 0-16 0" />
                                        </g>
                                    </svg>
                                </a>
                            </li>

                            <li>
                                <a href="/wishlist" class="relative">
                                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 36 36"
                                        class="1xl:w-[24px] 1xl:h-[24px] sm:w-[22px] sm:h-[22px] w-[20px] h-[20px] fill-black hover:fill-violet-900">
                                        <path stroke="none"
                                            d="M18 32.43a1 1 0 0 1-.61-.21C11.83 27.9 8 24.18 5.32 20.51C1.9 15.82 1.12 11.49 3 7.64c1.34-2.75 5.19-5 9.69-3.69A9.87 9.87 0 0 1 18 7.72a9.87 9.87 0 0 1 5.31-3.77c4.49-1.29 8.35.94 9.69 3.69c1.88 3.85 1.1 8.18-2.32 12.87c-2.68 3.67-6.51 7.39-12.07 11.71a1 1 0 0 1-.61.21M10.13 5.58A5.9 5.9 0 0 0 4.8 8.51c-1.55 3.18-.85 6.72 2.14 10.81A57 57 0 0 0 18 30.16a57 57 0 0 0 11.06-10.83c3-4.1 3.69-7.64 2.14-10.81c-1-2-4-3.59-7.34-2.65a8 8 0 0 0-4.94 4.2a1 1 0 0 1-1.85 0a7.93 7.93 0 0 0-4.94-4.2a7.3 7.3 0 0 0-2-.29"
                                            class="clr-i-outline clr-i-outline-path-1" />
                                        <path fill="none" d="M0 0h36v36H0z" />
                                    </svg>
                                </a>
                            </li>

                            <li>
                                <div class="flex justify-center items-center">
                                    <div x-data="{ open: false }" class="flex justify-center items-center">
                                        <!-- Sidebar Overlay -->
                                        <div x-show="open" class="fixed inset-0 z-50 overflow-hidden">
                                            <div x-show="open"
                                                x-transition:enter="transition-opacity ease-out duration-300"
                                                x-transition:enter-start="opacity-0"
                                                x-transition:enter-end="opacity-100"
                                                x-transition:leave="transition-opacity ease-in duration-300"
                                                x-transition:leave-start="opacity-100"
                                                x-transition:leave-end="opacity-0"
                                                class="absolute inset-0 bg-gray-500 bg-opacity-75 transition-opacity">
                                            </div>
                                            <!-- Sidebar Content -->
                                            <section class="absolute inset-y-0 right-0 pl-5 max-w-full flex">
                                                <div x-show="open"
                                                    x-transition:enter="transition-transform ease-out duration-300"
                                                    x-transition:enter-start="transform translate-x-full"
                                                    x-transition:enter-end="transform translate-x-0"
                                                    x-transition:leave="transition-transform ease-in duration-300"
                                                    x-transition:leave-start="transform translate-x-0"
                                                    x-transition:leave-end="transform translate-x-full"
                                                    class="w-screen lg:max-w-sm sm:max-w-[21rem]">
                                                    <div
                                                        class="h-full flex flex-col bg-white shadow-xl md:px-[26px] sm:px-5 px-4 md:py-5 py-3">
                                                        <!-- Sidebar Header -->
                                                        <div class="flex items-center justify-between">
                                                            <h3 class="text-[20px] font-medium text-black">CART</h3>
                                                            <button x-on:click="open = false"
                                                                class="text-gray-500 hover:text-gray-700">
                                                                <span class="sr-only">Close</span>
                                                                <svg class="sm:h-6 sm:w-6 h-5 w-5 stroke-violet-900"
                                                                    x-description="Heroicon name: x"
                                                                    xmlns="http://www.w3.org/2000/svg" fill="none"
                                                                    viewBox="0 0 24 24" aria-hidden="true">
                                                                    <path stroke-linecap="round" stroke-linejoin="round"
                                                                        stroke-width="2" d="M6 18L18 6M6 6l12 12">
                                                                    </path>
                                                                </svg>
                                                            </button>
                                                        </div>

                                                        <hr
                                                            class="w-full border border-lightborder-200 sm:mt-5 mt-2 1xl:mb-9 xl:mb-7 sm:mb-5 mb-2" />
                                                        <!-- Sidebar Content -->
<div class="mt-4">
    <p class="text-sm">This screen is a design example. Nothing is saved.</p>
    <p class="text-sm mt-3"><a class="border-b border-black" href="{{ partial:partials/contact-href }}">Send an inquiry</a></p>
</div>

                                                    </div>
                                                </div>
                                            </section>
                                        </div>
                                        <!-- Open sidebar button -->
                                        <button x-on:click="open = true" class="relative text-white rounded-md">
                                            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"
                                                class="1xl:w-[22px] 1xl:h-[22px] sm:w-[20px] sm:h-[20px] w-[18px] h-[18px] hover:stroke-violet-900 stroke-black">
                                                <path stroke-width="1.5" fill="none"
                                                    d="M2 12h20l-2 11H4zm18-4l-6-7M4 8l6-7M1 8h22v4H1zm7 7v5m8-5v5m-4-5v5" />
                                            </svg>
                                        </button>
                                    </div>
                                </div>
                            </li>
                        </ul>
                        <!-- <end> -->
                    </div>
                    <button id="menuToggle" class="lg:hidden text-gray-800">
                        <svg class="sm:w-5 sm:h-5 w-4 h-3" aria-hidden="true" xmlns="http://www.w3.org/2000/svg"
                            fill="none" viewBox="0 0 17 14">
                            <path stroke="black" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M1 1h15M1 7h15M1 13h15" />
                        </svg>
                    </button>
                </div>
            </div>
        </nav>
    </header>
