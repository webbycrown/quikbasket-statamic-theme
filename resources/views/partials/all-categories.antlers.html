<div class="all-categories" x-data="{ open: false }">
    <button type="button" @click.away="open = false" @click="open = !open" :aria-expanded="open.toString()" aria-controls="all-categories-menu" class="group">
        <span class="flex items-center gap-[13px]">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-6 z-[60]" aria-hidden="true">
                <path stroke-linecap="round" stroke-linejoin="round" d="M8.25 6.75h12M8.25 12h12m-12 5.25h12M3.75 6.75h.007v.008H3.75V6.75Zm.375 0a.375.375 0 1 1-.75 0 .375.375 0 0 1 .75 0ZM3.75 12h.007v.008H3.75V12Zm.375 0a.375.375 0 1 1-.75 0 .375.375 0 0 1 .75 0Zm-.375 5.25h.007v.008H3.75v-.008Zm.375 0a.375.375 0 1 1-.75 0 .375.375 0 0 1 .75 0Z" />
            </svg>
            <p class="{{ if tone == 'ink' }}font-normal text-sm text-gray-800{{ else }}font-light text-white{{ /if }}">All Categories</p>
        </span>
        <svg :class="{'rotate-180': open, 'rotate-0': !open}" class="ml-2 h-4 w-4 transform transition-transform duration-200 ease-in-out" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path>
        </svg>
    </button>
    <div x-show="open" x-transition:enter="transition ease-out duration-200 transform" x-transition:enter-start="opacity-0 -translate-y-2 z-0" x-transition:enter-end="opacity-100 translate-y-0 z-50" x-transition:leave="transition ease-in duration-150 transform" x-transition:leave-start="opacity-100 translate-y-0 z-50" x-transition:leave-end="opacity-0 -translate-y-2 z-0" id="all-categories-menu" class="all-categories-mainmenu">
        <div class="py-2 text-gray-700 text-sm" role="menu" aria-orientation="vertical" aria-labelledby="options-menu">
            {{ taxonomy:categories }}
            <a href="{{ url }}" class="menuitem group" role="menuitem">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="xl:size-5 size-4 -translate-x-5 group-hover:block group-hover:translate-x-0 group-hover:opacity-100 opacity-0 transition duration-700 ease-in-out" aria-hidden="true">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M13.5 4.5 21 12m0 0-7.5 7.5M21 12H3" />
                </svg>
                <p class="menuitem-name group-hover:translate-x-0">{{ title }}</p>
            </a>
            {{ /taxonomy:categories }}
        </div>
    </div>
</div>
